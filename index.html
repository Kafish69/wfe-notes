<style>
:root{
  --bg:#fafaf8; --card:#ffffff; --ink:#111111; --mute:#75716a; --line:#e4e1da; --line2:#111111;
  --acc:#d4ff3a; --ok:#16a34a; --bad:#e11d48; --soft:#f1efea; --code:#f4f2ed;

}

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}

pre.code{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55;margin:12px 0;position:relative}
pre.code .tg{color:#9333ea} pre.code .at{color:#b45309} pre.code .st{color:#15803d} pre.code .cm{color:var(--mute)}
[data-theme=dark] pre.code .tg{color:#c084fc} [data-theme=dark] pre.code .at{color:#fbbf24} [data-theme=dark] pre.code .st{color:#86efac}
.copy{position:absolute;top:8px;right:8px;font:500 11px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:6px;padding:2px 7px;cursor:pointer;opacity:0;transition:opacity .15s}
pre.code:hover .copy{opacity:1}

<template id="notes"><!-- CHAPTER 1 -->
<section class="ch" id="ch-links" data-title="Links, tables & images" data-n="01">
<h2>Links, tables & images</h2>
<p class="lead">How pages point to other things, how to show tabular data, and which image format to pick.</p>

<h3>Links</h3>
<p>A link is an <code>&lt;a&gt;</code> (anchor) tag. <code>href</code> = where it goes, the text between the tags = what the user clicks.</p>
<pre class="code">&lt;a href="mypage.html"&gt;Go there!&lt;/a&gt;</pre>
<div class="grid2">
  <div class="note"><b>Absolute link</b> (inside your site): starts with <code>/</code> and is always seen <em>from the root</em> of the site.<br><code>/pages/products.html</code></div>
  <div class="note"><b>Relative link</b>: starts from the file you are in. <b>Preferred.</b><br><code>pages/products.html</code> · <code>../</code> = one folder up</div>
</div>
<ul>
  <li>Other website: <code>href="https://www.google.com"</code> (or <code>//www.google.com</code>). Usability rule: open other websites in a <b>new tab</b>.</li>
  <li>Never link to a file on your own disk like <code>C:\My Documents\file.htm</code>.</li>
  <li>Jump to a part of the same page: give the target an <code>id</code> and link with <code>#</code>: <code>&lt;a href="#info"&gt;</code> → <code>&lt;h1 id="info"&gt;</code>.</li>
  <li>Part of <em>another</em> page: combine both: <code>href="about.html#team"</code>.</li>
</ul>
<div class="widget" data-w="paths"></div>

<h3>Tables</h3>
<p>Only for <b>tabular data</b> (if it would go in a spreadsheet, it's a table). <b>Never</b> use tables for layout. Think in <b>rows first</b>: a <code>&lt;tr&gt;</code> must close before the next starts, and every row needs the same number of cells.</p>
<pre class="code">&lt;table&gt;
  &lt;thead&gt;
    &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;Score&lt;/th&gt;&lt;/tr&gt;
  &lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Anna&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
  &lt;tfoot&gt;
    &lt;tr&gt;&lt;td&gt;Average&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
  &lt;/tfoot&gt;
&lt;/table&gt;</pre>
<p class="small muted"><code>th</code> = header cell, <code>td</code> = data cell, <code>tr</code> = table row.</p>

<h3>Images</h3>
<pre class="code">&lt;img src="cat.jpg" alt="A grey cat sleeping" title="Our cat"&gt;</pre>
<ul>
  <li><code>src</code> = the image (preferably a relative link). <code>alt</code> = <b>mandatory</b>, shown when the image is not (yet) available and read by screen readers. <code>title</code> = tooltip on hover.</li>
  <li><b>Content images</b> (they mean something) go in <b>HTML</b>. <b>Decoration</b> (backgrounds, design) goes in <b>CSS</b>.</li>
  <li>Bitmaps can shrink but never grow without losing quality. <b>Never scale disproportionately.</b></li>
  <li>Need a visible caption? Wrap it: <code>&lt;figure&gt;</code> + <code>&lt;img&gt;</code> + <code>&lt;figcaption&gt;</code>.</li>
</ul>
<pre class="code">&lt;figure&gt;
  &lt;img src="cat.jpg" alt="A grey cat sleeping"&gt;
  &lt;figcaption&gt;Our cat after exam week&lt;/figcaption&gt;
&lt;/figure&gt;</pre>

<h3>Image formats</h3>
<div class="tbl"><table>
<tr><th></th><th>Type</th><th>Compression</th><th>Transparency</th><th>Animation</th><th>Use it for</th></tr>
<tr><td><b>JPEG</b></td><td>bitmap, true colour</td><td>lossy</td><td>no</td><td>no</td><td>photos, max compatibility</td></tr>
<tr><td><b>GIF</b></td><td>bitmap, max 256 colours</td><td>lossy (inferior)</td><td>1 colour only (binary)</td><td><b>yes</b></td><td>flat areas of colour, simple animation</td></tr>
<tr><td><b>PNG</b></td><td>bitmap, true colour</td><td><b>lossless</b></td><td><b>yes</b> (real)</td><td>no (only APNG)</td><td>transparency, big files</td></tr>
<tr><td><b>WebP</b></td><td>bitmap (Google)</td><td>lossy or lossless</td><td>yes</td><td>yes</td><td>versatile modern format</td></tr>
<tr><td><b>AVIF</b></td><td>bitmap (AV1)</td><td>lossy or lossless, best</td><td>yes</td><td>yes</td><td>high-quality photos, smallest files, limited support</td></tr>
<tr><td><b>SVG</b></td><td><b>vector</b></td><td>(calculated shapes)</td><td>yes</td><td>with CSS/JS</td><td>logos, icons, infinite scaling</td></tr>
</table></div>
<ul class="small">
  <li><b>Lossy</b> = permanently throws data away (irreversible). <b>Lossless</b> = removes only unnecessary data (reversible).</li>
  <li><b>Gamut</b> = how many colours exist. <b>Bit depth</b> = how finely you can mix between them.</li>
  <li><b>Icon fonts</b>: fonts with symbols instead of letters. Vector, 1 HTTP request for hundreds of icons, sized and coloured like text, simple images only.</li>
  <li>Quick pick: backwards compatibility → <b>JPEG</b> · versatility → <b>WebP</b> · best photo quality + compression → <b>AVIF</b>.</li>
</ul>

<h3>&lt;picture&gt; and progressive enhancement</h3>
<p><b>Progressive enhancement</b>: give the modern version to browsers that support it, and a <b>fallback</b> to the rest. With images you do that with <code>&lt;picture&gt;</code>:</p>
<pre class="code">&lt;picture&gt;
  &lt;source srcset="art.avif" type="image/avif"&gt;
  &lt;source srcset="art.webp" type="image/webp"&gt;
  &lt;img src="art.jpg" alt="Art" title="Art"&gt;
&lt;/picture&gt;</pre>
<ul>
  <li>The browser takes the <b>first</b> <code>&lt;source&gt;</code> it supports. <b>Order matters!</b></li>
  <li>The <code>&lt;img&gt;</code> fallback is <b>mandatory</b>: screen readers read alt/title from it, and old browsers show it.</li>
</ul>
<div class="widget" data-w="picture"></div>
<div class="quiz" data-c="links"></div>

<!-- CHAPTER 2 -->
<section class="ch" id="ch-sem" data-title="Semantic HTML" data-n="02">
<h2>Semantic HTML</h2>
<p class="lead">Semantics = what a piece of code <em>means</em>, not what it looks like. It helps browsers, screen readers and search engines understand your page.</p>
<div class="widget" data-w="layout"></div>
<div class="tbl"><table>
<tr><th>Tag</th><th>Meaning</th><th>Rules to remember</th></tr>
<tr><td><code>header</code></td><td>introductory content (title, logo, often the nav)</td><td>multiple allowed, don't overuse</td></tr>
<tr><td><code>nav</code></td><td>main or sub navigation</td><td>not for every list of links</td></tr>
<tr><td><code>main</code></td><td>the main content of the page</td><td><b>only one per page</b>; never inside article, header, footer, aside or nav</td></tr>
<tr><td><code>section</code></td><td>thematic group (chapter, tab)</td><td><b>needs a heading</b> (h1–h6); not "the new div"</td></tr>
<tr><td><code>article</code></td><td>independent content that makes sense on its own (blog post, news item, a card you could share)</td><td>can be nested (comments inside an article)</td></tr>
<tr><td><code>aside</code></td><td>indirectly related (sidebar, related articles, banner)</td><td></td></tr>
<tr><td><code>footer</code></td><td>footer of the page or of a part of it</td><td>multiple allowed</td></tr>
<tr><td><code>div</code> / <code>span</code></td><td>no meaning at all</td><td>only to group for <b>graphical</b> reasons: div for blocks, span inside text</td></tr>
</table></div>
<div class="grid2">
  <div class="note"><b>em vs strong vs span</b><br><code>em</code> = emphasis (stress), <code>strong</code> = importance. Both add meaning to a piece of text. <code>span</code> adds none.</div>
  <div class="note"><b>Others you saw</b><br><code>figure</code>/<code>figcaption</code>, <code>time</code>, <code>address</code>, <code>blockquote</code>, <code>cite</code>, <code>abbr</code>, <code>code</code>, <code>mark</code>, <code>details</code>/<code>summary</code>, <code>fieldset</code> (forms only).</div>
</div>
<h3>Valid HTML</h3>
<ul>
  <li>Always run your page through the <b>W3C validator</b> (validator.w3.org). That one counts.</li>
  <li>Headings must follow the order of a table of contents: <code>h1 → h2 → h3</code>. An <code>h3</code> straight after <code>h1</code> is <b>not valid</b>. Want it to look different? Do it in CSS.</li>
  <li>An <code>id</code> must be unique on the page.</li>
</ul>
<pre class="code">&lt;!-- NOT valid --&gt;        &lt;!-- valid --&gt;
&lt;h1&gt;Title&lt;/h1&gt;             &lt;h1&gt;Title&lt;/h1&gt;
&lt;h3&gt;Sub&lt;/h3&gt;               &lt;h2&gt;Sub&lt;/h2&gt;
&lt;h2&gt;Sub&lt;/h2&gt;               &lt;h3&gt;Sub sub&lt;/h3&gt;</pre>
<div class="note warn"><b>Never do this:</b> <code>&lt;div class="header"&gt;</code>, <code>&lt;div class="main"&gt;</code>… If a semantic tag exists for it, use the tag.</div>
<div class="quiz" data-c="sem"></div>
</section>

<!-- CHAPTER 3 -->
<section class="ch" id="ch-css" data-title="CSS basics & cascading" data-n="03">
<h2>CSS basics & cascading</h2>
<p class="lead">Where CSS goes, how a rule is built, and what "cascading" really means.</p>
<h3>3 ways to add CSS</h3>
<div class="grid3">
  <div class="note good"><b>External file</b> ✓ the right way<br><code>&lt;link rel="stylesheet" type="text/css" href="screen.css"&gt;</code> in the <code>&lt;head&gt;</code> of <b>every</b> page.</div>
  <div class="note"><b>&lt;style&gt; block</b> in the head<br>works, but "yuck"</div>
  <div class="note warn"><b>Inline</b> <code>style="..."</code><br>"you will burn alive"</div>
</div>
<h3>Syntax</h3>
<pre class="code">selector {
  property: value;   /* ; ends a declaration */
  property: value;
}                    /* { } group the rules for the selector */</pre>
<p>Most used properties: <code>color</code>, <code>background-color</code>, <code>background-image</code>, <code>border</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>margin</code>, <code>padding</code>, <code>text-align</code>, <code>width</code>, <code>display</code>, <code>flex</code>.</p>

<h3>Cascading = inheritance</h3>
<p>Some properties <b>pass down</b> to children automatically (auto-inherited), others don't.</p>
<div class="grid2">
  <div class="note good"><b>Inherited</b> (text stuff)<br><code>color</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>text-align</code>…</div>
  <div class="note"><b>Not inherited</b> (box stuff)<br><code>margin</code>, <code>padding</code>, <code>border</code>, <code>width</code>, <code>background-color</code>…</div>
</div>
<p class="small"><b>The background snag:</b> <code>background-color</code> is not inherited, but children look like they have it because their default background is <code>transparent</code>, so you see the parent's background through them.</p>
<div class="widget" data-w="inherit"></div>

<h3>Best practices</h3>
<ol>
  <li><b>Declare 4 things on <code>body</code></b>: <code>font-family</code>, <code>font-size</code>, <code>color</code>, <code>background-color</code>. They cascade down.</li>
  <li><b>Declare on the parent, overwrite on the child</b>: <code>section { font-size: 1.2rem }</code> + <code>section h2 { font-size: 3rem }</code>. Future-proof.</li>
  <li><b>Resize the container</b>, not every child: <code>section { width: 70% }</code>, not <code>section h2, section p, section ul { width: 70% }</code>.</li>
  <li><b>Auto-size images</b>: <code>img { max-width: 100% }</code> so they never overflow their container.</li>
  <li><b>Fallback fonts</b>: <code>font-family: Arial, Helvetica, sans-serif;</code>. The last one is always generic: <code>serif</code>, <code>sans-serif</code> or <code>monospace</code>.</li>
</ol>
<h3>Reset CSS</h3>
<p>Every browser has its own default styles. A <b>reset.css</b> (Howest uses <b>Eric Meyer's</b>) puts them all at the same baseline. Load it <b>first</b>, your own CSS after it, on every page:</p>
<pre class="code">&lt;link rel="stylesheet" type="text/css" href="reset.css"&gt;
&lt;link rel="stylesheet" type="text/css" href="screen.css"&gt;</pre>
<div class="quiz" data-c="css"></div>
</section>

<!-- CHAPTER 4 -->
<section class="ch" id="ch-sel" data-title="Selectors & specificity" data-n="04">
<h2>Selectors & specificity</h2>
<p class="lead">How to point at the right elements, and who wins when two rules fight.</p>
<div class="tbl"><table>
<tr><th>Selector</th><th>Example</th><th>Selects</th></tr>
<tr><td>element</td><td><code>h1</code></td><td>all h1's</td></tr>
<tr><td>class</td><td><code>.special</code></td><td>every element with class="special"</td></tr>
<tr><td>id</td><td><code>#products</code></td><td>the one element with id="products" (unique!)</td></tr>
<tr><td>list <code>,</code></td><td><code>h1, h2</code></td><td>h1's <b>and</b> h2's</td></tr>
<tr><td>descendant <code>(space)</code></td><td><code>nav a</code></td><td>a's <b>anywhere inside</b> nav (child, grandchild…) — <b>use this by default</b></td></tr>
<tr><td>child <code>&gt;</code></td><td><code>ul &gt; li</code></td><td>only <b>direct</b> children. Very restrictive, use with care.</td></tr>
<tr><td>next sibling <code>+</code></td><td><code>h1 + h2</code></td><td>the h2 <b>right after</b> an h1 (same parent)</td></tr>
<tr><td>subsequent sibling <code>~</code></td><td><code>h3 ~ p</code></td><td>every p <b>after</b> an h3 with the same parent (not necessarily right after)</td></tr>
<tr><td>pseudo-class</td><td><code>a:hover</code>, <code>li:first-child</code>, <code>tr:nth-child(odd)</code></td><td>elements in a certain state/position</td></tr>
</table></div>
<p class="small muted">Use <code>:first-child</code>, <code>:last-child</code>, <code>:nth-child(odd/even)</code> freely. <code>:nth-child(3)</code> for "the third item looks different"? Not future-proof: <b>use a class</b>.</p>
<div class="widget" data-w="selector"></div>

<h3>Specificity (weights)</h3>
<p>When rules conflict, the selector with the <b>highest weight</b> wins. Equal weight → the rule that comes <b>last</b> wins.</p>
<div class="grid3">
  <div class="note"><b>1</b><br>element / pseudo-element<br><code>p</code> <code>h2</code> <code>::before</code></div>
  <div class="note"><b>10</b><br>class / attribute / pseudo-class<br><code>.x</code> <code>[type]</code> <code>:hover</code></div>
  <div class="note"><b>100</b><br>id<br><code>#container</code></div>
</div>
<p class="small">Examples from the slides: <code>article h2</code> = 2 · <code>nav ul li a:hover</code> = 14 · <code>#container p.special</code> = 111 · <code>.flexcontainer article p:first-child span</code> = 23. Combinators (space, &gt;, +, ~) count 0.</p>
<div class="widget" data-w="spec"></div>
<div class="note"><b>Class or id?</b> Class = reusable, many elements. Id = exactly one unique element per page (also a link target with <code>#</code>). In CSS you'll mostly use classes.</div>
<div class="quiz" data-c="sel"></div>
</section>

<!-- CHAPTER 5 -->
<section class="ch" id="ch-box" data-title="Box model & display" data-n="05">
<h2>Box model & display</h2>
<p class="lead">Every element is a box. Layout = placing those boxes next to, below or inside each other.</p>
<h3>Display modes</h3>
<div class="tbl"><table>
<tr><th></th><th>block</th><th>inline</th><th>inline-block</th></tr>
<tr><td>Width by default</td><td>full width of its parent</td><td>as wide as its content</td><td>as wide as its content</td></tr>
<tr><td>Forces a new line?</td><td><b>yes</b></td><td>no</td><td>no</td></tr>
<tr><td>Vertical margin/padding?</td><td>yes</td><td><b>no</b> (only x-axis)</td><td>yes</td></tr>
<tr><td>width / height work?</td><td>yes</td><td><b>no</b></td><td>yes</td></tr>
<tr><td>Default for</td><td>div, p, h1–h6, ul, ol, li, all semantic containers</td><td>span, a, strong, em</td><td>img</td></tr>
</table></div>
<div class="widget" data-w="display"></div>

<h3>The box</h3>
<p>From inside to outside: <b>content</b> → <b>padding</b> (space inside the box) → <b>border</b> → <b>margin</b> (space outside, towards the neighbours). Think of a garden: the plants are the content, the lawn around them is padding, the fence is the border and the gap to the neighbour's fence is the margin.</p>
<div class="formula">total visual width = width + padding (left + right) + border (left + right)<br><span class="muted small">margin is not part of it; it's the space around the box</span></div>
<p>The background fills the content <b>and</b> the padding (and runs under the border; the border is drawn on top).</p>
<div class="widget" data-w="box"></div>
<h3>box-sizing</h3>
<div class="grid2">
  <div class="note"><b>content-box</b> (standard)<br><code>width</code> = only the content. Padding and border come <b>on top</b>.<br><span class="small">20rem + 2rem padding + 2×1rem border = <b>24rem</b></span></div>
  <div class="note"><b>border-box</b><br><code>width</code> = the total visual width. Padding and border are taken <b>out of it</b>.<br><span class="small">20rem = 2rem + 2×1rem + <b>16rem</b> content</span></div>
</div>
<p class="small muted">Only change box-sizing when you really need to; switching it around casually confuses other developers.</p>

<h3>Sizing</h3>
<p><code>width</code>, <code>min-width</code>, <code>max-width</code>, <code>height</code>, <code>min-height</code>, <code>max-height</code>. Classic responsive container: <code>width: 90%; max-width: 60rem; margin: 0 auto;</code> → grows and shrinks with the screen, stops at 60rem, centered.</p>

<h3>Collapsing margins</h3>
<p>When two vertical margins touch, they don't add up: the <b>biggest one wins</b>.</p>
<div class="widget" data-w="collapse"></div>
<ul class="small">
  <li>Also happens between a parent and its first/last child (margin-top 1rem + child margin-top 2rem → 2rem at the top).</li>
  <li>Only when they really touch: a border, padding or content in between stops the collapsing.</li>
  <li>Inside a <b>flex</b> container margins do <b>not</b> collapse.</li>
</ul>
<div class="quiz" data-c="box"></div>
</section>

<!-- CHAPTER 6 -->
<section class="ch" id="ch-flex" data-title="Layout & flexbox" data-n="06">
<h2>Layout & flexbox</h2>
<p class="lead">In this course only two layout techniques are allowed: <b>inline-block</b> and <b>flexbox</b>.</p>
<div class="tbl"><table>
<tr><th>Technique</th><th>Verdict</th></tr>
<tr><td>float</td><td>only meant to let text wrap around an image. Never for layout.</td></tr>
<tr><td>position (absolute…)</td><td>only for elements that go "off-grid". Never for a full layout.</td></tr>
<tr><td>display: table</td><td>obsolete, don't use</td></tr>
<tr><td><b>inline-block</b></td><td>small things side by side (figures, list items) when spacing doesn't matter. Problem: <b>whitespace</b> in the HTML shows up as a gap; no equal heights.</td></tr>
<tr><td><b>flexbox</b></td><td>everything else: nav bars, rows of cards, components, centering. Positions on <b>one axis</b>.</td></tr>
<tr><td>grid</td><td>two axes, whole page layouts (semester 2)</td></tr>
</table></div>
<h3>Container vs items</h3>
<p>You put <code>display: flex</code> on the <b>container</b>. Its <b>direct children</b> become flex items.</p>
<pre class="code">main { display: flex; }      /* main = container, its articles = items */</pre>
<div class="tbl"><table>
<tr><th>On the container</th><th>What it does</th></tr>
<tr><td><code>flex-direction</code></td><td><code>row</code> (default) | <code>row-reverse</code> | <code>column</code> | <code>column-reverse</code></td></tr>
<tr><td><code>flex-wrap</code></td><td><code>nowrap</code> (default, items squeeze on one line) | <code>wrap</code> | <code>wrap-reverse</code></td></tr>
<tr><td><code>flex-flow</code></td><td>shorthand for direction + wrap: <code>flex-flow: row wrap</code></td></tr>
<tr><td><code>gap</code></td><td>space between items: <code>gap: 1rem</code> or <code>gap: 1rem 2rem</code> (row-gap column-gap)</td></tr>
<tr><td><code>justify-content</code></td><td>align on the <b>main axis</b>: flex-start, center, flex-end, space-between, space-around, space-evenly</td></tr>
<tr><td><code>align-items</code></td><td>align on the <b>cross axis</b>: stretch (default → equal heights!), center, flex-start, flex-end</td></tr>
<tr><td><code>align-content</code></td><td>cross axis for <b>multiple wrapped lines</b></td></tr>
<tr><th>On an item</th><th></th></tr>
<tr><td><code>align-self</code></td><td>exception on the cross axis for one item</td></tr>
<tr><td><code>flex-grow</code></td><td>how much of the <b>extra space</b> it gets (default 0 = no growing)</td></tr>
<tr><td><code>flex-shrink</code></td><td>how much it shrinks when there's not enough space (0 = never smaller than its basis)</td></tr>
<tr><td><code>flex-basis</code></td><td>the ideal starting size. Use it instead of <code>width</code> (if both are set, flex-basis wins)</td></tr>
<tr><td><code>flex</code></td><td>shorthand: <code>flex: grow shrink basis</code> → <code>flex: 0 0 50%</code>. Don't leave out the basis.</td></tr>
</table></div>
<div class="note"><b>Axes flip!</b> With <code>flex-direction: column</code> the main axis is vertical, so <code>justify-content</code> works vertically and <code>align-items</code> horizontally.</div>
<div class="widget" data-w="flex"></div>
<h3>How flex-grow divides space</h3>
<div class="formula">item width = (flex-grow ÷ total flex-grow) × available space + initial width</div>
<p class="small">Slide example: container has 730px free, item 1 has <code>flex: 3 1 30rem</code> (480px), items 2 and 3 have <code>flex: 1 1 auto</code> (75px each). Item 1 = 3/5 × 730 + 480 = <b>918px</b>. flex-grow does <b>not</b> make items equal: it shares the <i>extra</i> space.</p>
<div class="widget" data-w="grow"></div>
<ul class="small">
  <li><b>Auto margins</b> in a flex item push in any direction: <code>margin-left: auto</code> pushes an item to the far right (classic nav trick). Margins beat the alignment properties.</li>
  <li><b>Centering</b> something horizontally and vertically: <code>display:flex; justify-content:center; align-items:center;</code>. A block horizontally: <code>margin: 0 auto</code> + a width.</li>
</ul>
<div class="quiz" data-c="flex"></div>
</section>

<!-- CHAPTER 7 -->
<section class="ch" id="ch-forms" data-title="Forms & accessibility" data-n="07">
<h2>Forms & accessibility</h2>
<p class="lead">Forms collect user data and send it to the server.</p>
<pre class="code">&lt;form action="login.php" method="post"&gt;
  &lt;label for="user"&gt;User&lt;/label&gt;
  &lt;input type="text" name="user" id="user"&gt;
  &lt;label for="pw"&gt;Password&lt;/label&gt;
  &lt;input type="password" name="pw" id="pw"&gt;
  &lt;input type="submit" value="Login"&gt;
&lt;/form&gt;</pre>
<ul>
  <li><code>action</code> = the script that handles the data. <code>method</code> = <code>get</code> or <code>post</code>.</li>
  <li><b>Every form element belongs inside a <code>&lt;form&gt;</code></b>, otherwise it's not sent.</li>
  <li><b><code>name</code></b> is what's sent to the server (mandatory). <b><code>id</code></b> is never sent: it's for CSS, JS and labels. Good practice: same value for both.</li>
  <li><b><code>&lt;label for="x"&gt;</code></b> links to the input with <code>id="x"</code>: screen readers read it and clicking the label focuses/checks the input.</li>
  <li><b>Radio buttons / checkboxes are grouped by the same <code>name</code></b>. Different names = they don't belong together (you could select both "male" and "female"). Checkbox groups often use <code>name="vehicle[]"</code>.</li>
  <li>The <code>value</code> is what gets sent, so keep it language-agnostic (<code>value="female"</code>, not the translated label text).</li>
  <li>Selected by default: <code>checked</code> for radio/checkbox, <code>selected</code> for an <code>&lt;option&gt;</code>.</li>
  <li><code>placeholder</code> = grey hint text, disappears when you type, <b>not sent</b>. <code>value</code> = real pre-filled content that <b>is</b> sent.</li>
  <li><code>&lt;fieldset&gt;</code> (+ <code>&lt;legend&gt;</code>) groups related fields in long forms. Only inside forms.</li>
</ul>
<div class="widget" data-w="form"></div>
<h3>Submit vs button</h3>
<div class="grid2">
  <div class="note good"><b>Sends the form</b> (works even without JavaScript):<br><code>&lt;input type="submit"&gt;</code> · <code>&lt;button&gt;</code> · <code>&lt;button type="submit"&gt;</code></div>
  <div class="note warn"><b>Does nothing without JS:</b><br><code>&lt;button type="button"&gt;</code> · <code>&lt;input type="button"&gt;</code><br>Only OK for extra, non-critical features.</div>
</div>
<ul class="small">
  <li><code>&lt;input type="reset"&gt;</code> clears the form. Leave it out unless people fill in the same form over and over (too easy to hit by accident).</li>
  <li><b>Link or button?</b> Link (<code>&lt;a&gt;</code>) = go somewhere (new page/section, Enter key). Button = do an action (send, open, close; Space key).</li>
  <li>HTML validation (<code>required</code>, <code>type="email"</code>, <code>min</code>, <code>pattern</code>…) gives quick feedback, but it is <b>not secure one bit</b>: always validate on the server too.</li>
  <li>Check browser support on <b>caniuse.com</b>.</li>
</ul>
<h3>Accessibility (a11y)</h3>
<p>Make things usable for <b>everyone</b>: vision (low vision, contrast, colour blindness: very common in men), hearing, touch, mobility, speech, cognitive. Often it's the situation: sunlight on your phone, a noisy train station, running for a train. EU law requires <b>WCAG 2.1 level AA</b>. Unobtrusive JS: the page must still work when JavaScript fails.</p>
<div class="quiz" data-c="forms"></div>
</section>

<!-- CHAPTER 8 -->
<section class="ch" id="ch-http" data-title="HTTP request & response" data-n="08">
<h2>HTTP request & response</h2>
<p class="lead">Every page load is a conversation: the client <b>requests</b>, the server <b>responds</b>.</p>
<div class="grid2">
  <div class="note"><b>Client side</b> (runs in the browser)<br>HTML, CSS, JavaScript</div>
  <div class="note"><b>Server side</b> (runs on the server)<br>PHP, Python, .NET…</div>
</div>
<h3>A request</h3>
<pre class="code">GET /index.html HTTP/1.1        ← method · request target · protocol
Host: localhost:5000            ← headers (Host is mandatory in HTTP/1.1)
Accept-Language: en-GB</pre>
<p class="small"><b>Origin form</b>: <code>GET /index.html HTTP/1.1</code> (path only). <b>Absolute form</b>: <code>GET http://localhost:5000/index.html HTTP/1.1</code> (full URL).</p>
<div class="tbl"><table>
<tr><th>Method</th><th>Does</th><th>Idempotent</th><th>Safe</th></tr>
<tr><td><b>GET</b></td><td>retrieve (read-only)</td><td>yes</td><td>yes</td></tr>
<tr><td><b>POST</b></td><td>submit / create</td><td>no</td><td>no</td></tr>
<tr><td>PUT</td><td>replace</td><td>yes</td><td>no</td></tr>
<tr><td>PATCH</td><td>partial change</td><td>no</td><td>no</td></tr>
<tr><td>DELETE</td><td>remove</td><td>yes</td><td>no</td></tr>
</table></div>
<p class="small"><b>Idempotent</b> = doing it 10 times has the same effect as once (deleting user 123 twice: still gone). POST /payment twice = charged twice → not idempotent.</p>
<h3>GET vs POST</h3>
<div class="grid2">
  <div class="note"><b>GET</b>: data in the <b>query string</b> of the URL<br><code>https://example.com/page?name=dog&amp;color=black</code><br><span class="small"><code>?</code> starts it, <code>key=value</code> pairs, joined with <code>&amp;</code></span></div>
  <div class="note"><b>POST</b>: data in the <b>request body</b> (payload / form data), type given by the <code>Content-Type</code> header (forms: <code>application/x-www-form-urlencoded</code>)</div>
</div>
<div class="note warn">Is POST more secure because you don't see the data in the URL? <b>No!</b> Hiding ≠ securing.</div>
<div class="widget" data-w="http"></div>
<h3>Headers</h3>
<p>Headers are <b>metadata</b> sent along, not the data itself.</p>
<div class="grid2">
  <div class="note"><b>Request headers</b><br><code>Host</code> server domain (mandatory) · <code>Accept</code> types the client understands · <code>Accept-Language</code> · <code>Content-Type</code> format of the body (absent if no body) · <code>Authorization</code> credentials · <code>Referer</code> previous page · <code>User-Agent</code> browser/OS info</div>
  <div class="note"><b>Response headers</b><br><code>Content-Type</code> media type returned · <code>Content-Encoding</code> how to decode · <code>Date</code> · <code>Server</code> server software · <code>Set-Cookie</code> server sends a cookie · (<code>Cookie</code> = the client sending it back)</div>
</div>
<h3>The response</h3>
<pre class="code">HTTP/1.1 200 OK          ← protocol · status code · reason phrase</pre>
<div class="tbl"><table>
<tr><th>Code</th><th>Meaning</th></tr>
<tr><td>1xx / 2xx / 3xx / 4xx / 5xx</td><td>info / success / redirect / <b>client</b> error / <b>server</b> error</td></tr>
<tr><td><b>200</b> OK</td><td>processed fine. Not proof the page is correct (an error message can come with a 200).</td></tr>
<tr><td><b>401</b> Unauthorized</td><td>no or wrong credentials → really an <b>authentication</b> problem</td></tr>
<tr><td><b>403</b> Forbidden</td><td>you're known but not allowed → <b>authorization</b> problem</td></tr>
<tr><td><b>404</b> Not Found</td><td>nothing at that URL</td></tr>
<tr><td><b>418</b> I'm a teapot</td><td>April Fools' joke code</td></tr>
<tr><td><b>500</b> Internal Server Error</td><td>the server crashed on something (catch-all)</td></tr>
<tr><td><b>503</b> Service Unavailable</td><td>temporarily can't handle it (overload, maintenance)</td></tr>
</table></div>
<div class="note"><b>Attacker mindset:</b> status codes and headers leak info. 404s map a site, 403 says "this folder exists", 500 error pages and <code>Server</code> headers reveal the tech stack, a 200 on <code>/admin</code> is jackpot. Blindly trusting <code>Content-Type</code> led to the Equifax hack (Apache Struts, CVE-2017-5638).</div>
<div class="quiz" data-c="http"></div>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const toast = m => { const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),1700); };
let S = {theme:null, read:{}, best:{}};
try { Object.assign(S, JSON.parse(localStorage.getItem('wfe-notes')||'{}')); } catch(e){}
const save = () => { try { localStorage.setItem('wfe-notes', JSON.stringify(S)); } catch(e){} };

// chapters from template
const tpl = document.createElement('div'); tpl.innerHTML = $('#notes').innerHTML;
const CH = $$('section.ch', tpl).map(s => ({id: s.id.replace('ch-',''), title: s.dataset.title, n: s.dataset.n, html: s.innerHTML, lead: ($('.lead', s)||{}).textContent || ''}));
const CHK = Object.fromEntries(CH.map(c => [c.id, c]));

// theme
function applyTheme(){ const t = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; $('#theme').textContent = t==='dark' ? 'light' : 'dark'; }
$('#theme').onclick = () => { S.theme = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; save(); applyTheme(); };
applyTheme();

function prog(){ const n = CH.filter(c => S.read[c.id]).length; $('#prog').textContent = `${n}/${CH.length} read`; }
function toc(cur){
  $('#toc').innerHTML = `<div class="lab">Chapters</div>` + CH.map(c => `<a href="#/${c.id}" class="${c.id===cur?'on':''}"><span class="n">${c.n}</span><span>${esc(c.title)}</span>${S.read[c.id]?'<span class="ck">✓</span>':''}</a>`).join('') +
    `<div class="lab">Test yourself</div><a href="#/practice" class="${cur==='practice'?'on':''}"><span class="n">→</span><span>Exam practice</span></a>`;
  $$('.top a').forEach(a => a.classList.toggle('on', (a.dataset.r==='practice') === (cur==='practice')));
}

// code highlighting for HTML/CSS samples
function hl(code){
  let s = esc(code);
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
  s = s.replace(/(&lt;\/?)([a-z][a-z0-9]*)/g, '$1<span class="tg">$2</span>');
  s = s.replace(/ ([a-z-]+)=(&quot;.*?&quot;)/g, ' <span class="at">$1</span>=<span class="st">$2</span>');
  return s;
}

// ================= HOME
function home(){
  app.innerHTML = `<h1>Web Development<br><span class="hl">Fundamentals.</span></h1>
  <p class="lead">Every slide from weeks 1–6 turned into short notes you actually understand, with live demos to play with and questions after every chapter. HTML, semantics, CSS, selectors, box model, flexbox, forms and HTTP.</p>
  <div class="row"><a class="btn pri" href="#/${CH.find(c=>!S.read[c.id])?.id || CH[0].id}">${CH.some(c=>S.read[c.id]) ? 'Continue reading →' : 'Start reading →'}</a><a class="btn" href="#/practice">Exam practice (${QS.length} questions)</a></div>
  <div class="cards">${CH.map(c => `<a class="chcard" href="#/${c.id}"><div class="n">${c.n}${S.read[c.id]?' · read ✓':''}${S.best[c.id]!=null?` · quiz ${S.best[c.id]}%`:''}</div><h4>${esc(c.title)}</h4><p>${esc(c.lead)}</p></a>`).join('')}</div>
  <p class="small muted" style="margin-top:30px">Tip: read a chapter, play with its demo, do its quiz, then hit "I get this". Finish with Exam practice. <button class="btn sm" id="rst" style="margin-left:6px">Reset progress</button></p>`;
  let armed=false; $('#rst').onclick = e => { const b=e.currentTarget; if(!armed){armed=true;b.textContent='Tap again to reset';b.classList.add('danger');setTimeout(()=>{armed=false;if(document.body.contains(b)){b.textContent='Reset progress';b.classList.remove('danger');}},4000);return;} S.read={}; S.best={}; save(); prog(); route(); toast('Progress reset'); };
}

// ================= CHAPTER
function chapter(id){
  const c = CHK[id], i = CH.indexOf(c);
  app.innerHTML = `<div class="mobnav"><select id="jump">${CH.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.n} — ${esc(x.title)}</option>`).join('')}<option value="practice">→ Exam practice</option></select></div>
  <div class="muted small mono" style="margin-top:28px">chapter ${c.n} / 08</div>${c.html}
  <div class="done-btn"><button class="btn ${S.read[id]?'':'pri'}" id="done">${S.read[id]?'✓ Marked as understood':'I get this ✓'}</button></div>
  <div class="pager">${i>0?`<a href="#/${CH[i-1].id}">← previous<b>${esc(CH[i-1].title)}</b></a>`:'<span></span>'}${i<CH.length-1?`<a href="#/${CH[i+1].id}" style="text-align:right">next →<b>${esc(CH[i+1].title)}</b></a>`:`<a href="#/practice" style="text-align:right">finish →<b>Exam practice</b></a>`}</div>`;
  $('#jump').onchange = e => location.hash = '#/' + e.target.value;
  $('#done').onclick = () => { S.read[id] = !S.read[id]; save(); prog(); toc(id); $('#done').textContent = S.read[id] ? '✓ Marked as understood' : 'I get this ✓'; $('#done').classList.toggle('pri', !S.read[id]); if (S.read[id]) toast('Nice. On to the next one.'); };
  // code blocks
  $$('pre.code', app).forEach(p => { const raw = p.textContent; p.innerHTML = hl(raw) + '<button class="copy">copy</button>'; $('.copy', p).onclick = () => { try { navigator.clipboard.writeText(raw); toast('Copied'); } catch(e){} }; });
  $$('.widget', app).forEach(w => (W[w.dataset.w] || (()=>{}))(w));
  $$('.quiz', app).forEach(q => chapterQuiz(q, q.dataset.c));
}

// ================= QUIZ ENGINE
function norm(s){ return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/\s*([;:,{}])\s*/g,'$1').replace(/;$/,'').replace(/^["']|["']$/g,''); }
function checkSA(q, v){ const u = x => norm(x).replace(/\s*(px|rem)$/,''); const n = norm(v); return q.a.some(a => norm(a) === n || u(a) === u(v)); }
function renderQ(box, q, onDone){
  const opts = q.k==='mcq' ? shuffle(q.o.map((t,j)=>j)) : null;
  box.innerHTML = `<div style="font-weight:600;margin-bottom:6px">${esc(q.q).replace(/ {2}(\S(?:.*?\S)?) {2}/g,' <code>$1</code> ')}</div>${q.code?`<pre class="code">${hl(q.code)}</pre>`:''}
    ${q.k==='mcq' ? opts.map((j,n)=>`<button class="opt" data-j="${j}"><span class="k">${'abcd'[n]}</span><span>${esc(q.o[j])}</span></button>`).join('') :
    `<div class="row"><input class="ans" placeholder="type your answer + enter" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1"><button class="btn pri ck">Check</button></div>`}<div class="qfb"></div>`;
  let done = false;
  const finish = ok => { done = true; $('.qfb', box).innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct':'Not quite'}</b>${q.k==='sa'?` → <code>${esc(q.a[0])}</code>`:''}${q.ex?` <span class="muted">· ${esc(q.ex)}</span>`:''}</div><div class="row" style="margin-top:10px"><button class="btn pri nx">Next →</button></div>`; $('.nx', box).onclick = () => onDone(ok); $('.nx', box).focus(); };
  if (q.k==='mcq') $$('.opt', box).forEach(b => b.onclick = () => { if (done) return; const j=+b.dataset.j, ok = j===q.a; $$('.opt', box).forEach(x => { if (+x.dataset.j===q.a) x.classList.add('ok'); else if (x===b) x.classList.add('bad'); }); finish(ok); });
  else { const inp = $('.ans', box); const go = () => { if (done || !inp.value.trim()) return; const ok = checkSA(q, inp.value); inp.classList.add(ok?'ok':'bad'); finish(ok); }; $('.ck', box).onclick = go; inp.onkeydown = e => { if (e.key==='Enter') go(); }; }
}
function chapterQuiz(el, c){
  const pool = QS.filter(q => q.c===c);
  const start = () => {
    const set = shuffle(pool).slice(0, 6); let i = 0, ok = 0;
    const step = () => {
      if (i >= set.length){ const p = Math.round(100*ok/set.length); S.best[c] = Math.max(S.best[c]||0, p); save();
        el.innerHTML = `<div class="wt">check yourself</div><div class="row"><div class="score" style="font-size:54px">${ok}/${set.length}</div><span class="muted">${p>=80?'You get this chapter.':p>=50?'Almost. Reread the parts you missed.':'Reread this chapter, then try again.'}</span></div><div class="row"><button class="btn pri again">New questions</button><span class="small muted">${pool.length} questions in this chapter</span></div>`;
        $('.again', el).onclick = start; return; }
      el.innerHTML = `<div class="wt">check yourself · ${i+1}/${set.length}</div><div class="bar" style="margin-bottom:12px"><i style="width:${100*i/set.length}%"></i></div><div class="qb"></div>`;
      renderQ($('.qb', el), set[i], r => { if (r) ok++; i++; step(); });
    };
    step();
  };
  el.innerHTML = `<div class="wt">check yourself</div><p style="margin:0 0 12px">6 random questions about this chapter, exam style.</p><button class="btn pri go">Start quiz</button>`;
  $('.go', el).onclick = start;
}

// ================= PRACTICE (mixed)
let pr = null;
function practice(){
  if (!pr || pr.done){
    app.innerHTML = `<div class="mobnav"><select id="jump"><option value="">Exam practice</option>${CH.map(x=>`<option value="${x.id}">${x.n} — ${esc(x.title)}</option>`).join('')}</select></div>
    <h2 style="margin-top:34px">Exam practice</h2><p class="lead">20 random questions from all 8 chapters. Different every time. At the end you see which chapters to reread.</p>
    ${pr && pr.done ? results() : ''}
    <div class="row"><button class="btn pri" id="go">${pr&&pr.done?'New round':'Start'} →</button></div>`;
    $('#jump').onchange = e => { if (e.target.value) location.hash = '#/' + e.target.value; };
    $('#go').onclick = () => { const by = {}; QS.forEach(q => (by[q.c] ||= []).push(q)); let set = []; CH.forEach(c => set.push(...shuffle(by[c.id]||[]).slice(0,2))); set = shuffle(set.concat(shuffle(QS.filter(q=>!set.includes(q))).slice(0, 20-set.length))); pr = {set, i:0, res:[], done:false}; practice(); };
    return;
  }
  const q = pr.set[pr.i];
  app.innerHTML = `<h2 style="margin-top:34px">Exam practice</h2><div class="row small muted"><span>question ${pr.i+1}/${pr.set.length}</span><span class="sp"></span><span>${esc(CHK[q.c].title)}</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:${100*pr.i/pr.set.length}%"></i></div><div class="widget" id="pq"></div>`;
  renderQ($('#pq'), q, ok => { pr.res.push(ok); pr.i++; if (pr.i >= pr.set.length) pr.done = true; practice(); scrollTo(0,0); });
}
function results(){
  const ok = pr.res.filter(Boolean).length, n = pr.res.length, p = Math.round(100*ok/n);
  const per = {}; pr.set.forEach((q,i) => { (per[q.c] ||= [0,0]); per[q.c][1]++; if (pr.res[i]) per[q.c][0]++; });
  return `<div class="widget"><div class="wt">last round</div><div class="score">${p}%</div><p class="muted" style="margin-top:0">${ok}/${n} correct. ${p>=80?'Exam ready.':p>=60?'Good. Fix the weak chapters below.':'Reread the red chapters, then go again.'}</p>

W.spec = el => {

    let s = sel.replace(/\([^)]*\)/g,''); const r = {id:0, cls:0, el:0};
    r.id = (s.match(/#[\w-]+/g)||[]).length; s = s.replace(/#[\w-]+/g,' ');
    r.cls += (s.match(/\.[\w-]+/g)||[]).length; s = s.replace(/\.[\w-]+/g,' ');
    r.cls += (s.match(/\[[^\]]*\]/g)||[]).length; s = s.replace(/\[[^\]]*\]/g,' ');
    r.el += (s.match(/::[\w-]+/g)||[]).length; s = s.replace(/::[\w-]+/g,' ');
    r.cls += (s.match(/:[\w-]+/g)||[]).length; s = s.replace(/:[\w-]+/g,' ');
    r.el += (s.match(/(^|[\s>+~])[a-z][\w-]*/gi)||[]).length;
    return r;
  };
  const draw = v => { const parts = v.split(',').map(x=>x.trim()).filter(Boolean); $('#so', el).innerHTML = parts.map(p => { const r = calc(p); const w = r.id*100 + r.cls*10 + r.el; return `<div><code>${esc(p)}</code> = <b>${w}</b> <span class="muted">(${r.id} id × 100 + ${r.cls} class/attr/pseudo-class × 10 + ${r.el} element × 1)</span></div>`; }).join('') || '<span class="muted">type a selector</span>'; };
  el.innerHTML = `${head(el,'try it · specificity calculator')}<input type="text" id="si" value="#container p.special" autocomplete="off" spellcheck="false" style="width:100%"><div class="out" id="so"></div>
  <p class="small muted" style="margin:8px 0 0">Try: <code>nav ul li a:hover</code> · <code>.flexcontainer article p:first-child span</code> · <code>h1, .title, #main</code></p>`;

    $('#go2', el).innerHTML = st.items.map(([g,w],i)=>`item ${i+1} = (${g} ÷ ${tg}) × ${st.space} + ${w} = <b>${Math.round(ws[i]*100)/100}px</b>`).join('<br>');
  };
  el.innerHTML = `${head(el,'try it · flex-grow calculator')}<div class="ctrls"><label class="ctl">available space (px)<input type="number" id="gs" value="${st.space}"></label>${st.items.map(([g,w],i)=>`<label class="ctl">item ${i+1} grow / initial px<span class="row" style="gap:6px;flex-wrap:nowrap"><input type="number" min="0" value="${g}" data-i="${i}" data-f="0" style="width:60px"><input type="number" min="0" value="${w}" data-i="${i}" data-f="1" style="width:80px"></span></label>`).join('')}</div><div class="growbars"></div><div class="out" id="go2"></div>`;
  $('#gs', el).oninput = e => { st.space = Math.max(0, +e.target.value||0); draw(); };
  $$('input[data-i]', el).forEach(inp => inp.oninput = () => { st.items[+inp.dataset.i][+inp.dataset.f] = Math.max(0, +inp.value||0); draw(); });
  draw();
};

// form → request
W.form = el => {
  let method = 'get';
  el.innerHTML = `${head(el,'try it · fill the form, see what is sent')}
  <div class="pick" style="margin-bottom:12px"><button data-m="get" class="ok">method="get"</button><button data-m="post">method="post"</button></div>
  <form class="stage" id="ff" action="order.php" style="display:grid;gap:10px">
    <label class="ctl">First name<input type="text" name="firstName" id="firstName" value="Jane"></label>
    <label class="ctl">Nickname (placeholder only)<input type="text" name="nick" id="nick" placeholder="e.g. JD"></label>
    <fieldset style="border:1px solid var(--line);border-radius:8px"><legend class="small">Pizza (radio, same name)</legend>
      <label class="chk"><input type="radio" name="pizza" id="veggie" value="veggie" checked> Veggie</label>
      <label class="chk"><input type="radio" name="pizza" id="pepperoni" value="pepperoni"> Pepperoni</label></fieldset>
    <fieldset style="border:1px solid var(--line);border-radius:8px"><legend class="small">Extras (checkboxes)</legend>
      <label class="chk"><input type="checkbox" name="extra[]" id="cheese" value="cheese"> Cheese</label>
      <label class="chk"><input type="checkbox" name="extra[]" id="olives" value="olives"> Olives</label></fieldset>
    <label class="ctl">Country<select name="country" id="country"><option value="BE" selected>Belgium</option><option value="NL">Netherlands</option></select></label>
    <input type="text" id="noName" placeholder="field with an id but NO name → never sent">
  </form><div class="out" id="fo"></div>
  <p class="small muted" style="margin:8px 0 0">Notice: ids are never sent, only <code>name=value</code>. The empty placeholder field sends an empty value. Unchecked checkboxes are not sent at all.</p>`;
  const draw = () => {
    const fd = new FormData($('#ff', el)); const qs = new URLSearchParams(fd).toString();
    $('#fo', el).textContent = method==='get'
      ? `GET /order.php?${qs} HTTP/1.1\nHost: localhost:5000\n\n(no body: the data is in the query string of the URL)`
      : `POST /order.php HTTP/1.1\nHost: localhost:5000\nContent-Type: application/x-www-form-urlencoded\nContent-Length: ${qs.length}\n\n${qs}`;
  };
  $('#ff', el).oninput = draw; $('#ff', el).onchange = draw; $('#ff', el).onsubmit = e => e.preventDefault();
  $$('.pick button', el).forEach(b => b.onclick = () => { method = b.dataset.m; $$('.pick button', el).forEach(x=>x.classList.toggle('ok', x===b)); draw(); });
  draw();
};

// http: status code game
W.http = el => {
  const cases = [['You request /photos/cat.jpg but that file doesn\'t exist.','404'],['You log in with the wrong password.','401'],['You are logged in as a normal user and open /admin.','403'],['Everything worked, here is your page.','200'],['The PHP script throws an unhandled exception.','500'],['The server is in maintenance mode.','503'],['The server refuses to brew coffee because it is a teapot.','418']];
  let deck = shuffle(cases), i = 0, ok = 0;
  const draw = () => {
    if (i >= deck.length){ el.innerHTML = `${head(el,'mini game · which status code?')}<p><b>${ok}/${deck.length}</b> correct.</p><button class="btn pri" id="hg">Play again</button>`; $('#hg', el).onclick = () => { deck = shuffle(cases); i=0; ok=0; draw(); }; return; }
    const [txt, code] = deck[i];
    el.innerHTML = `${head(el,`mini game · which status code? ${i+1}/${deck.length}`)}<p style="font-weight:600">${esc(txt)}</p><div class="pick">${['200','401','403','404','418','500','503'].map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div><div id="hf"></div>`;
    $$('.pick button', el).forEach(b => b.onclick = () => { if ($('#hf', el).innerHTML) return; const r = b.dataset.c===code; if (r) ok++; b.classList.add(r?'ok':'bad'); if (!r) $(`.pick button[data-c="${code}"]`, el).classList.add('ok'); $('#hf', el).innerHTML = `<div class="fb ${r?'ok':'bad'}">${r?'Correct':'It\'s '+code}. <button class="btn sm" id="hn">next</button></div>`; $('#hn', el).onclick = () => { i++; draw(); }; });
  };
  draw();
};

const app = $('#app');
function route(){
  const r = location.hash.replace(/^#\/?/,'');
  toc(r || 'home'); prog();
  if (!r) home(); else if (r==='practice') practice(); else if (CHK[r]) chapter(r); else home();
  scrollTo(0,0);
}
addEventListener('hashchange', route);
route();
window.__wfe = { checkSA, QS, CH };
})();
</script>
