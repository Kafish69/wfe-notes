<div class="note"><b>Woh kis cheez par focus karte hain:</b> valid aur invalid code mein farq · sahi semantic tag · selectors · box model · side by side ke liye inline-block ya flex · <b>box</b> (block) aur <b>text</b> (inline) ka farq · cascade · request/response ki gehri samajh.</div>
<h3>Terminology & HTML basics</h3>
<ul>
  <li><b>Internet</b> = computers ka duniya bhar ka network. <b>Web (WWW)</b> = woh pages aur links jo is par HTTP se milte hain.</li>
  <li><b>Client</b> = browser jo <b>maangta</b> hai · <b>server</b> = computer jo <b>jawab</b> deta hai. Browser HTML + CSS ko <b>render</b> karta (banata) hai aur JS chalata hai.</li>
  <li><b>HTML</b> = dhaancha aur content · <b>CSS</b> = shakal surat · <b>JavaScript</b> = harkat (behaviour).</li>
  <li><b>Element</b> = start tag + content + end tag: <code>&lt;p&gt;Hi&lt;/p&gt;</code>. <b>Attribute</b> = start tag mein izafi maloomat: <code>name="value"</code>.</li>
  <li><b>Void elements</b> ka end tag nahi hota: <code>img</code>, <code>br</code>, <code>hr</code>, <code>input</code>, <code>link</code>, <code>meta</code>.</li>
  <li><b>Nesting</b>: ulti tarteeb mein band karo. <code>&lt;p&gt;&lt;em&gt;hi&lt;/em&gt;&lt;/p&gt;</code> ✓ · <code>&lt;p&gt;&lt;em&gt;hi&lt;/p&gt;&lt;/em&gt;</code> ✗</li>
  <li>Har page: <code>&lt;!DOCTYPE html&gt;</code> → <code>&lt;html lang="en"&gt;</code> → <code>&lt;head&gt;</code> (meta charset, title, CSS link) + <code>&lt;body&gt;</code> (jo nazar aata hai).</li>
  <li>Comments: HTML mein <code>&lt;!-- --&gt;</code>, CSS mein <code>/* */</code>. Khaas characters: <code>&amp;lt;</code> &lt; · <code>&amp;gt;</code> &gt; · <code>&amp;amp;</code> &amp; · <code>&amp;nbsp;</code> · <code>&amp;copy;</code> ©.</li>
  <li><b>Valid code</b> = standard ke mutabiq (W3C validator). Browser ghaltiyan maaf kar deta hai, is liye "theek dikh raha hai" ka matlab valid nahi.</li>
  <li><b>URL ke hissay</b>: <code>https://</code> protocol · <code>www.shop.be</code> host · <code>:443</code> port · <code>/products/list.html</code> path · <code>?id=4&amp;c=red</code> query string · <code>#reviews</code> fragment (server ko kabhi nahi jata).</li>
</ul>
<pre class="code">&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8"&gt;
  &lt;title&gt;My page&lt;/title&gt;
  &lt;link rel="stylesheet" href="css/screen.css"&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
<h3>Tables: rowspan & colspan</h3>
<ul>
  <li><code>colspan="3"</code> = cell <b>3 columns</b> par phaila hua (daayen-baayen).</li>
  <li><code>rowspan="5"</code> = cell <b>5 rows</b> par phaila hua (upar-neeche).</li>
  <li><code>&lt;caption&gt;</code> = table ka title. <code>&lt;th scope="col"&gt;</code> / <code>scope="row"</code> screen reader ko batata hai heading kis ki hai.</li>
</ul>

<h3>CSS custom properties (variables)</h3>
<p><b>Custom property</b> ek value ko ek baar save karti hai taake har jagah use ho. Ek jagah badlo → har jagah badal jaye.</p>
<pre class="code">:root {                       /* :root = html element → har jagah mil jata hai */
  --main-color: #0a7a55;
  --gap: 1.5rem;
}
h1 { color: var(--main-color); }
.card { margin-bottom: var(--gap); border: 2px solid var(--main-color); }
.btn { background-color: var(--accent, orange); }   /* --accent na ho to orange */
.dark-section { --main-color: white; }              /* sirf is section ke andar badla */</pre>
<ul>
  <li>Naam <b>do dashes se shuru</b>: <code>--main-color</code>. Naam <b>case-sensitive</b> hain.</li>
  <li><code>var(--name)</code> se use karo; doosri value <b>fallback</b> hai: <code>var(--accent, orange)</code>.</li>
  <li>Custom properties <b>cascade aur inherit</b> hoti hain: <code>:root</code> par = global; kisi selector par = us element aur us ke bachon ke liye; qareeb wali jeetti hai.</li>
  <li>Sirf <b>values</b> ke liye: property ke naam ya selector mein use nahi ho sakti.</li>
</ul>
<h3>CSS positioning techniques</h3>
<p>Tareeqe: <code>display: inline-block</code>, <code>display: flex</code>, <code>display: grid</code>, <code>position: …</code>, <code>float: …</code> (aur purana <code>display: table</code>). Is course mein <b>inline-block</b> aur <b>flex</b>.</p>
<div class="note warn"><b>Trick options:</b> <code>display: position</code>, <code>display: float</code>, <code>display: table-grid</code>, <code>display: content-oneline</code>, <code>display: border-box</code> <b>mojood hi nahi</b>. position aur float alag properties hain, border-box box-sizing ki value hai.</div>
<p><b>Box vs text:</b> <code>a</code> inline (text) hai. Agar anchors ek line mein hon <b>aur un ki width aur chaaron taraf border ho</b>, to woh <code>display: inline-block</code> hain (inline width nahi leta; block har ek ko nai line par daal deta).</p>
<h3>HTTP readout parhna (network panel)</h3>
<div class="grid2">
  <div class="note"><b>Request</b> shuru hoti hai <b>METHOD path protocol</b> se<br><code>GET / HTTP/2</code><br>phir request headers: Host, User-Agent, Accept, Accept-Language…</div>
  <div class="note"><b>Response</b> shuru hota hai <b>protocol + status code</b> se<br><code>HTTP/2 200</code> (HTTP/2 mein reason phrase nahi) ya <code>HTTP/1.1 200 OK</code><br>phir response headers: server, date, content-type…</div>
</div>
<div class="tbl"><table>
<tr><th>Header</th><th>Kya batata hai</th></tr>
<tr><td><code>Host: www.polygon.com</code></td><td>kaunsi site/application maangi ja rahi hai</td></tr>
<tr><td><code>User-Agent</code></td><td>user ka browser + OS. Sab <code>Mozilla/5.0</code> se shuru (tareekhi wajah). Dhoondo: <b>Firefox/</b> (+ <code>Gecko/20100101</code>, <code>rv:</code>) = Firefox · <b>Edg/</b> = Edge · <b>Chrome/</b> bina Edg = Chrome · <b>Version/… Safari/</b> bina Chrome = Safari. Header hi nahi = browser nazar nahi aata.</td></tr>

<h3>GET URL mein password</h3>
<ul>
  <li>GET form password URL mein daal deta hai: <code>login.php?user=ann&amp;pw=secret</code>.</li>
  <li>✓ URL <b>browser history</b> mein save hota hai. ✓ <b>Server logs</b> mein aa sakta hai (proxy logs, Referer…).</li>
  <li>✗ <b>Percent-encoding</b> (<code>%20</code>…) sirf characters ko URL-safe banata hai, <b>encryption nahi</b>. ✗ <code>type="password"</code> sirf <b>screen par chhupata</b> hai. ✗ Page load ke baad password URL se <b>gayab nahi</b> hota.</li>
  <li>Sahi: <b>method="post"</b> (data body mein) <b>+ HTTPS</b> (raste mein poori request encrypt).</li>
</ul>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];

// chapters from template
const parse = id => { const t = document.createElement('div'); t.innerHTML = $(id).innerHTML; return $$('section.ch', t).map(s => ({id: s.id.replace('ch-',''), title: s.dataset.title, n: s.dataset.n, html: s.innerHTML, lead: ($('.lead', s)||{}).textContent || ''})); };

let CH, CHK;
const UR = () => S.lang === 'ur';
const t = (en, ur) => UR() ? ur : en;
function setLang(){ CH = UR() ? CH_UR : CH_EN; CHK = Object.fromEntries(CH.map(c => [c.id, c])); document.documentElement.lang = UR() ? 'ur-Latn' : 'en'; $('#lang').textContent = UR() ? 'english' : 'urdu'; }

$('#lang').onclick = () => { S.lang = UR() ? 'en' : 'ur'; save(); setLang(); route(); toast(UR() ? 'Roman Urdu on. Quiz English mein hi rahenge, exam bhi English mein hai.' : 'English on'); };

// theme
function applyTheme(){ const t = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; $('#theme').textContent = t==='dark' ? 'light' : 'dark'; }
$('#theme').onclick = () => { S.theme = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; save(); applyTheme(); };

function prog(){ const n = CH.filter(c => S.read[c.id]).length; $('#prog').textContent = `${n}/${CH.length} read`; }

    `<div class="lab">Test yourself</div><a href="#/mock"><span class="n">→</span><span>Mock exam</span></a><a href="#/exam"><span class="n">→</span><span>300-question exam</span></a><a href="#/code"><span class="n">→</span><span>Code drills</span></a><a href="#/flash"><span class="n">→</span><span>Flashcards</span></a>`;
  $$('.top a').forEach(a => a.classList.toggle('on', (a.dataset.r==='practice') === (cur==='practice')));
}

// code highlighting for HTML/CSS samples
function hl(code){
  let s = esc(code);
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
  s = s.replace(/(&lt;\/?)([a-z][a-z0-9]*)/g, '$1<span class="tg">$2</span>');
  s = s.replace(/ ([a-z-]+)=(&quot;.*?&quot;)/g, ' <span class="at">$1</span>=<span class="st">$2</span>');
  return s;
}

// ================= CHAPTER
function chapter(id){
  const c = CHK[id], i = CH.indexOf(c);
  app.innerHTML = `<div class="mobnav"><select id="jump">${CH.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.n} — ${esc(x.title)}</option>`).join('')}<option value="mock">→ Mock exam</option></select></div>

  $$('pre.code', app).forEach(p => { const raw = p.textContent; p.innerHTML = hl(raw) + '<button class="copy">copy</button>'; $('.copy', p).onclick = () => { try { navigator.clipboard.writeText(raw); toast('Copied'); } catch(e){} }; });

// ================= QUIZ ENGINE
function norm(s){ return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/\s*([;:,{}])\s*/g,'$1').replace(/;$/,'').replace(/^["']|["']$/g,''); }
function checkSA_old(q, v){ const u = x => norm(x).replace(/\s*(px|rem)$/,''); const n = norm(v); return q.a.some(a => norm(a) === n || u(a) === u(v)); }
function multiOk(q, ch){ const a = [...q.a].sort().join(','), b = [...ch].map(Number).sort().join(','); return a===b; }
function renderQ(box, q, onDone){
  const opts = q.k!=='sa' ? shuffle(q.o.map((t,j)=>j)) : null;
  box.innerHTML = `<div style="font-weight:600;margin-bottom:6px">${esc(q.q).replace(/ {2}(\S(?:.*?\S)?) {2}/g,' <code>$1</code> ')}</div>${q.code?`<pre class="code">${hl(q.code)}</pre>`:''}
    ${q.k==='multi' ? `<div class="small muted" style="margin:4px 0">select all that apply</div>`+opts.map((j,n)=>`<button class="opt mt" data-j="${j}"><span class="k">☐</span><span>${esc(q.o[j])}</span></button>`).join('')+`<div class="row" style="margin-top:8px"><button class="btn pri ckm">Check</button></div>` : q.k==='mcq' ? opts.map((j,n)=>`<button class="opt" data-j="${j}"><span class="k">${'abcdefg'[n]}</span><span>${esc(q.o[j])}</span></button>`).join('') :
    `<div class="row"><input class="ans" placeholder="type your answer + enter" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1"><button class="btn pri ck">Check</button></div>`}<div class="qfb"></div>`;
  let done = false;
  const finish = ok => { done = true; $('.qfb', box).innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct':'Not quite'}</b>${q.k==='sa'?` → <code>${esc(q.a[0])}</code>`:''}${q.ex?` <span class="muted">· ${esc(q.ex)}</span>`:''}</div><div class="row" style="margin-top:10px"><button class="btn pri nx">Next →</button></div>`; $('.nx', box).onclick = () => onDone(ok); $('.nx', box).focus(); };
  if (q.k==='multi'){ $$('.opt', box).forEach(b => b.onclick = () => { if (done) return; b.classList.toggle('on'); $('.k',b).textContent = b.classList.contains('on')?'☑':'☐'; });
    $('.ckm', box).onclick = () => { if (done) return; const ch = $$('.opt.on', box).map(b=>+b.dataset.j); const ok = multiOk(q, ch); $$('.opt', box).forEach(x => { const j=+x.dataset.j, r=q.a.includes(j); if (r) x.classList.add('ok'); else if (x.classList.contains('on')) x.classList.add('bad'); }); $('.ckm', box).remove(); finish(ok); }; }
  else if (q.k==='mcq') $$('.opt', box).forEach(b => b.onclick = () => { if (done) return; const j=+b.dataset.j, ok = j===q.a; $$('.opt', box).forEach(x => { if (+x.dataset.j===q.a) x.classList.add('ok'); else if (x===b) x.classList.add('bad'); }); finish(ok); });
  else { const inp = $('.ans', box); const go = () => { if (done || !inp.value.trim()) return; const ok = checkAny(q, inp.value); inp.classList.add(ok?'ok':'bad'); finish(ok); }; $('.ck', box).onclick = go; inp.onkeydown = e => { if (e.key==='Enter') go(); }; }
}
function chapterQuiz(el, c){
  const pool = QS.filter(q => q.c===c);
  const start = () => {
    const set = shuffle(pool).slice(0, 6); let i = 0, ok = 0;
    const step = () => {
      if (i >= set.length){ const p = Math.round(100*ok/set.length); S.best[c] = Math.max(S.best[c]||0, p); save();
        el.innerHTML = `<div class="wt">check yourself</div><div class="row"><div class="score" style="font-size:54px">${ok}/${set.length}</div><span class="muted">${p>=80?t('You get this chapter.','Yeh chapter aa gaya.'):p>=50?t('Almost. Reread the parts you missed.','Kareeb ho. Jo ghalat hue woh hissay dobara parho.'):t('Reread this chapter, then try again.','Chapter dobara parho, phir try karo.')}</span></div><div class="row"><button class="btn pri again">New questions</button><span class="small muted">${pool.length} questions in this chapter</span></div>`;
        $('.again', el).onclick = start; return; }
      el.innerHTML = `<div class="wt">check yourself · ${i+1}/${set.length}</div><div class="bar" style="margin-bottom:12px"><i style="width:${100*i/set.length}%"></i></div><div class="qb"></div>`;
      renderQ($('.qb', el), set[i], r => { if (r) ok++; i++; step(); });
    };
    step();
  };
  el.innerHTML = `<div class="wt">check yourself</div><p style="margin:0 0 12px">${t('6 random questions about this chapter, exam style.','Is chapter ke 6 random sawal, exam jaise (English mein, kyunke exam bhi English mein hai).')}</p><button class="btn pri go">${t('Start quiz','Quiz shuru karo')}</button>`;
  $('.go', el).onclick = start;
}

  const challenges = [['every a inside nav','nav a'],['only the li\'s that are direct children of the nav\'s ul','nav > ul > li'],['the p right after an h2','h2 + p'],['all p\'s after the h3 (same parent)','h3 ~ p'],['everything with class special','.special'],['the nested li (child of a ul that is inside an li)','li li'],['all h2 and h3 elements','h2, h3'],['the first p of the article using its class','.intro']];
  const lines = src.split('\n');

  const setCh = () => { $('#chq', el).textContent = challenges[ch][0]; };

  $('#chn', el).onclick = () => { ch = (ch+1) % challenges.length; setCh(); $('#sel', el).value=''; draw(''); };

W.spec = el => {

    let s = sel.replace(/\([^)]*\)/g,''); const r = {id:0, cls:0, el:0};

    r.cls += (s.match(/\.[\w-]+/g)||[]).length; s = s.replace(/\.[\w-]+/g,' ');
    r.cls += (s.match(/\[[^\]]*\]/g)||[]).length; s = s.replace(/\[[^\]]*\]/g,' ');
    r.el += (s.match(/::[\w-]+/g)||[]).length; s = s.replace(/::[\w-]+/g,' ');
    r.cls += (s.match(/:[\w-]+/g)||[]).length; s = s.replace(/:[\w-]+/g,' ');
    r.el += (s.match(/(^|[\s>+~])[a-z][\w-]*/gi)||[]).length;
    return r;
  };
  const draw = v => { const parts = v.split(',').map(x=>x.trim()).filter(Boolean); $('#so', el).innerHTML = parts.map(p => { const r = calc(p); const w = r.id*100 + r.cls*10 + r.el; return `<div><code>${esc(p)}</code> = <b>${w}</b> <span class="muted">(${r.id} id × 100 + ${r.cls} class/attr/pseudo-class × 10 + ${r.el} element × 1)</span></div>`; }).join('') || '<span class="muted">type a selector</span>'; };
  el.innerHTML = `${head(el,'try it · specificity calculator')}<input type="text" id="si" value="#container p.special" autocomplete="off" spellcheck="false" style="width:100%"><div class="out" id="so"></div>
  <p class="small muted" style="margin:8px 0 0">Try: <code>nav ul li a:hover</code> · <code>.flexcontainer article p:first-child span</code> · <code>h1, .title, #main</code></p>`;

// better answer checking for code + values
function normA(v){
  let s = String(v).trim().toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/'/g,'"').replace(/\s+/g,' ');
  s = s.replace(/\s*\/>/g,'>');
  // sort attributes inside single tags
  s = s.replace(/<([a-z0-9]+)((?:\s+[a-z-]+(?:="[^"]*")?)*)\s*>/g, (m, tag, attrs) => {
    const a = (attrs.match(/[a-z-]+(?:="[^"]*")?/g) || []).sort(); return '<' + tag + (a.length ? ' ' + a.join(' ') : '') + '>'; });
  s = s.replace(/\s*([;:,{}>+~=])\s*/g,'$1').replace(/;(?=})/g,'').replace(/;$/,'').replace(/^["']|["']$/g,'');
  s = s.replace(/^\?/,'');
  return s;
}
const unit = x => normA(x).replace(/\s*(px|rem|em)$/,'');
function checkAny(q, v){
  if (!String(v).trim()) return false;
  if (q.k==='sa' && q.a.some(a => normA(a)===normA(v) || unit(a)===unit(v))) return true;
  // declarations in any order: compare as sets
  const decl = x => normA(x).replace(/^[^{]*\{|\}$/g,'').split(';').filter(Boolean).sort().join(';');
  return q.a.some(a => /:/.test(a) && !/^</.test(a) && decl(a) === decl(v));
}

function pickMock(N, lvl){
  const ok = i => lvl==='all' || QS[i].d >= 2;
  const by = {}; QS.forEach((q,i) => { if (ok(i)) (by[q.c] ||= []).push(i); });
  const per = Math.floor(N / CH.length);
  let ids = [];
  CH.forEach((c, ci) => { const pool = by[c.id] || []; const hard = shuffle(pool.filter(i=>QS[i].d===3)), rest = shuffle(pool.filter(i=>QS[i].d!==3));
    for (let k=0; k<per; k++){ const wantHard = (k + ci) % 2 === 0; const pref = wantHard ? hard : rest; const src = pref.length ? pref : (hard.length ? hard : rest); if (src.length) ids.push(src.pop()); } });

  if (!fl.q.length){ app.innerHTML = `<h2 style="margin-top:34px">Flashcards</h2>${chips()}<div class="card" style="text-align:center"><div class="score">${fl.total?'done':'—'}</div><p class="lead">${fl.total?`All ${fl.total} cards known.`:'No cards for this selection.'}</p></div><div class="row"><button class="btn pri" id="again">Shuffle again</button></div>`; bindChips(flashStart); $('#again').onclick = flashStart; return; }
  const c = FLASH[fl.q[0]];
  app.innerHTML = `<h2 style="margin-top:34px">Flashcards</h2>${chips()}<div class="row small muted" style="margin-top:8px"><span>${fl.got}/${fl.total} known</span><span class="sp"></span><span>${fl.q.length} left</span></div>
  <div class="bar" style="margin:8px 0"><i style="width:${fl.total?100*fl.got/fl.total:0}%"></i></div>
  <div class="flash ${fl.flipped?'flip':''}" id="card"><div class="in"><div class="f"><small>${esc(cn(c.c))}</small>${esc(c.f)}<div class="small muted" style="margin-top:14px;font-weight:500">tap to see the answer</div></div><div class="b"><small>${esc(cn(c.c))}</small><div class="small muted" style="font-family:var(--sans);margin-bottom:10px">${esc(c.f)}</div>${esc(c.b)}</div></div></div>
  <div class="row" style="justify-content:center" id="facts"></div>`;
  bindChips(flashStart);
  const card = $('#card');
  const buttons = () => { $('#facts').innerHTML = fl.flipped ? `<button class="btn" id="lrn">Still learning <span class="kbd">←</span></button><button class="btn pri" id="gt">Got it <span class="kbd">→</span></button>` : `<button class="btn pri" id="show">Show answer <span class="kbd">space</span></button>`;
    if (fl.flipped){ $('#lrn').onclick = later; $('#gt').onclick = got; } else $('#show').onclick = flip; };
  const flip = () => { fl.flipped = !fl.flipped; card.classList.toggle('flip', fl.flipped); flSave(); buttons(); };
  const later = () => { if (!fl.flipped) return; const id = fl.q.shift(); fl.q.splice(Math.min(fl.q.length, 3+Math.floor(Math.random()*3)), 0, id); fl.flipped = false; hit(false); flSave(); flash(); };
  const got = () => { if (!fl.flipped) return; fl.q.shift(); fl.got++; fl.flipped = false; hit(true); flSave(); flash(); };
  card.onclick = flip; buttons();
  keyH = e => { if (e.key===' '){ e.preventDefault(); flip(); } else if (e.key==='ArrowRight') got(); else if (e.key==='ArrowLeft') later(); };
}

// ================= CHEAT SHEET
function cheat(){
  app.innerHTML = `<h2 style="margin-top:34px">Cheat sheet</h2><p class="lead">${t('Everything on one page. Read it, then close it and drill.','Sab kuch ek page par. Parho, phir band karo aur practice karo.')}</p>
  <div class="grid">${CH.map(c=>`<div class="card cheat" style="margin:0"><h3><span class="mono small muted">${c.n}</span> ${esc(c.title)}</h3><ul>${(CHEAT[c.id]||[]).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

let keyH = null;
document.addEventListener('keydown', e => { if (keyH && e.target.tagName !== 'INPUT') keyH(e); });

// ================= ROUTER
const app = $('#app');
function route(){
  const r = location.hash.replace(/^#\/?/,'');
  keyH = null; clearInterval(mtimer); tabs(r); prog(); toc(r || 'home');
  $('#layout').classList.toggle('full', !CHK[r]);
  if (!r) home();
  else if (CHK[r]) chapter(r);
  else ({ notes: notesIndex, practice: () => location.hash = '#/mock', mock: () => mk && mk.src!=='e300' ? (mk.done ? mockResults(false) : mockRun()) : mockStart(), exam: () => mk && mk.src==='e300' ? (mk.done ? mockResults(false) : mockRun()) : examStart(), quiz: quizStart, fill, code, flash, cheat }[r] || home)();
  if (r !== 'code' && r !== 'fill') scrollTo(0,0);
}
addEventListener('hashchange', route);
route();
window.__wfe = { multiOk, renderQ, checkSA: checkAny, checkAny, normA, QS, CH: CH_EN, FLASH };
})();
</script>
