<section class="ch" id="ch-links" data-title="Links, tables & images" data-n="01">
<h2>Links, tables & images</h2>
<p class="lead">How pages point to other things, how to show tabular data, and which image format to pick.</p>

<h3>Links</h3>
<p>A link is an <code>&lt;a&gt;</code> (anchor) tag. <code>href</code> = where it goes, the text between the tags = what the user clicks.</p>
<pre class="code">&lt;a href="mypage.html"&gt;Go there!&lt;/a&gt;</pre>
<div class="grid2">
  <div class="note"><b>Absolute link</b> (inside your site): starts with <code>/</code> and is always seen <em>from the root</em> of the site.<br><code>/pages/products.html</code></div>
  <div class="note"><b>Relative link</b>: starts from the file you are in. <b>Preferred.</b><br><code>pages/products.html</code> · <code>../</code> = one folder up</div>
</div>
<ul>
  <li>Other website: <code>href="https://www.google.com"</code> (or <code>//www.google.com</code>). Usability rule: open other websites in a <b>new tab</b>.</li>
  <li>Never link to a file on your own disk like <code>C:\My Documents\file.htm</code>.</li>
  <li>Jump to a part of the same page: give the target an <code>id</code> and link with <code>#</code>: <code>&lt;a href="#info"&gt;</code> → <code>&lt;h1 id="info"&gt;</code>.</li>
  <li>Part of <em>another</em> page: combine both: <code>href="about.html#team"</code>.</li>
</ul>
<div class="widget" data-w="paths"></div>

<h3>Tables</h3>
<p>Only for <b>tabular data</b> (if it would go in a spreadsheet, it's a table). <b>Never</b> use tables for layout. Think in <b>rows first</b>: a <code>&lt;tr&gt;</code> must close before the next starts, and every row needs the same number of cells.</p>
<pre class="code">&lt;table&gt;
  &lt;thead&gt;
    &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;Score&lt;/th&gt;&lt;/tr&gt;
  &lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Anna&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
  &lt;tfoot&gt;
    &lt;tr&gt;&lt;td&gt;Average&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
  &lt;/tfoot&gt;
&lt;/table&gt;</pre>
<p class="small muted"><code>th</code> = header cell, <code>td</code> = data cell, <code>tr</code> = table row.</p>

<h3>Images</h3>
<pre class="code">&lt;img src="cat.jpg" alt="A grey cat sleeping" title="Our cat"&gt;</pre>
<ul>
  <li><code>src</code> = the image (preferably a relative link). <code>alt</code> = <b>mandatory</b>, shown when the image is not (yet) available and read by screen readers. <code>title</code> = tooltip on hover.</li>
  <li><b>Content images</b> (they mean something) go in <b>HTML</b>. <b>Decoration</b> (backgrounds, design) goes in <b>CSS</b>.</li>
  <li>Bitmaps can shrink but never grow without losing quality. <b>Never scale disproportionately.</b></li>
  <li>Need a visible caption? Wrap it: <code>&lt;figure&gt;</code> + <code>&lt;img&gt;</code> + <code>&lt;figcaption&gt;</code>.</li>
</ul>
<pre class="code">&lt;figure&gt;
  &lt;img src="cat.jpg" alt="A grey cat sleeping"&gt;
  &lt;figcaption&gt;Our cat after exam week&lt;/figcaption&gt;
&lt;/figure&gt;</pre>

<h3>Image formats</h3>
<div class="tbl"><table>
<tr><th></th><th>Type</th><th>Compression</th><th>Transparency</th><th>Animation</th><th>Use it for</th></tr>
<tr><td><b>JPEG</b></td><td>bitmap, true colour</td><td>lossy</td><td>no</td><td>no</td><td>photos, max compatibility</td></tr>
<tr><td><b>GIF</b></td><td>bitmap, max 256 colours</td><td>lossy (inferior)</td><td>1 colour only (binary)</td><td><b>yes</b></td><td>flat areas of colour, simple animation</td></tr>
<tr><td><b>PNG</b></td><td>bitmap, true colour</td><td><b>lossless</b></td><td><b>yes</b> (real)</td><td>no (only APNG)</td><td>transparency, big files</td></tr>
<tr><td><b>WebP</b></td><td>bitmap (Google)</td><td>lossy or lossless</td><td>yes</td><td>yes</td><td>versatile modern format</td></tr>
<tr><td><b>AVIF</b></td><td>bitmap (AV1)</td><td>lossy or lossless, best</td><td>yes</td><td>yes</td><td>high-quality photos, smallest files, limited support</td></tr>
<tr><td><b>SVG</b></td><td><b>vector</b></td><td>(calculated shapes)</td><td>yes</td><td>with CSS/JS</td><td>logos, icons, infinite scaling</td></tr>
</table></div>
<ul class="small">
  <li><b>Lossy</b> = permanently throws data away (irreversible). <b>Lossless</b> = removes only unnecessary data (reversible).</li>
  <li><b>Gamut</b> = how many colours exist. <b>Bit depth</b> = how finely you can mix between them.</li>
  <li><b>Icon fonts</b>: fonts with symbols instead of letters. Vector, 1 HTTP request for hundreds of icons, sized and coloured like text, simple images only.</li>
  <li>Quick pick: backwards compatibility → <b>JPEG</b> · versatility → <b>WebP</b> · best photo quality + compression → <b>AVIF</b>.</li>
</ul>

<h3>&lt;picture&gt; and progressive enhancement</h3>
<p><b>Progressive enhancement</b>: give the modern version to browsers that support it, and a <b>fallback</b> to the rest. With images you do that with <code>&lt;picture&gt;</code>:</p>
<pre class="code">&lt;picture&gt;
  &lt;source srcset="art.avif" type="image/avif"&gt;
  &lt;source srcset="art.webp" type="image/webp"&gt;
  &lt;img src="art.jpg" alt="Art" title="Art"&gt;
&lt;/picture&gt;</pre>
<ul>
  <li>The browser takes the <b>first</b> <code>&lt;source&gt;</code> it supports. <b>Order matters!</b></li>
  <li>The <code>&lt;img&gt;</code> fallback is <b>mandatory</b>: screen readers read alt/title from it, and old browsers show it.</li>
</ul>
<div class="widget" data-w="picture"></div>
<div class="quiz" data-c="links"></div>
</section>

<!-- CHAPTER 2 -->
<section class="ch" id="ch-sem" data-title="Semantic HTML" data-n="02">
<h2>Semantic HTML</h2>
<p class="lead">Semantics = what a piece of code <em>means</em>, not what it looks like. It helps browsers, screen readers and search engines understand your page.</p>
<div class="widget" data-w="layout"></div>
<div class="tbl"><table>
<tr><th>Tag</th><th>Meaning</th><th>Rules to remember</th></tr>
<tr><td><code>header</code></td><td>introductory content (title, logo, often the nav)</td><td>multiple allowed, don't overuse</td></tr>
<tr><td><code>nav</code></td><td>main or sub navigation</td><td>not for every list of links</td></tr>
<tr><td><code>main</code></td><td>the main content of the page</td><td><b>only one per page</b>; never inside article, header, footer, aside or nav</td></tr>
<tr><td><code>section</code></td><td>thematic group (chapter, tab)</td><td><b>needs a heading</b> (h1–h6); not "the new div"</td></tr>
<tr><td><code>article</code></td><td>independent content that makes sense on its own (blog post, news item, a card you could share)</td><td>can be nested (comments inside an article)</td></tr>
<tr><td><code>aside</code></td><td>indirectly related (sidebar, related articles, banner)</td><td></td></tr>
<tr><td><code>footer</code></td><td>footer of the page or of a part of it</td><td>multiple allowed</td></tr>
<tr><td><code>div</code> / <code>span</code></td><td>no meaning at all</td><td>only to group for <b>graphical</b> reasons: div for blocks, span inside text</td></tr>
</table></div>
<div class="grid2">
  <div class="note"><b>em vs strong vs span</b><br><code>em</code> = emphasis (stress), <code>strong</code> = importance. Both add meaning to a piece of text. <code>span</code> adds none.</div>
  <div class="note"><b>Others you saw</b><br><code>figure</code>/<code>figcaption</code>, <code>time</code>, <code>address</code>, <code>blockquote</code>, <code>cite</code>, <code>abbr</code>, <code>code</code>, <code>mark</code>, <code>details</code>/<code>summary</code>, <code>fieldset</code> (forms only).</div>
</div>
<h3>Valid HTML</h3>
<ul>
  <li>Always run your page through the <b>W3C validator</b> (validator.w3.org). That one counts.</li>
  <li>Headings must follow the order of a table of contents: <code>h1 → h2 → h3</code>. An <code>h3</code> straight after <code>h1</code> is <b>not valid</b>. Want it to look different? Do it in CSS.</li>
  <li>An <code>id</code> must be unique on the page.</li>
</ul>
<pre class="code">&lt;!-- NOT valid --&gt;        &lt;!-- valid --&gt;
&lt;h1&gt;Title&lt;/h1&gt;             &lt;h1&gt;Title&lt;/h1&gt;
&lt;h3&gt;Sub&lt;/h3&gt;               &lt;h2&gt;Sub&lt;/h2&gt;
&lt;h2&gt;Sub&lt;/h2&gt;               &lt;h3&gt;Sub sub&lt;/h3&gt;</pre>
<div class="note warn"><b>Never do this:</b> <code>&lt;div class="header"&gt;</code>, <code>&lt;div class="main"&gt;</code>… If a semantic tag exists for it, use the tag.</div>
<div class="quiz" data-c="sem"></div>
</section>

<!-- CHAPTER 3 -->
<section class="ch" id="ch-css" data-title="CSS basics & cascading" data-n="03">
<h2>CSS basics & cascading</h2>
<p class="lead">Where CSS goes, how a rule is built, and what "cascading" really means.</p>
<h3>3 ways to add CSS</h3>
<div class="grid3">
  <div class="note good"><b>External file</b> ✓ the right way<br><code>&lt;link rel="stylesheet" type="text/css" href="screen.css"&gt;</code> in the <code>&lt;head&gt;</code> of <b>every</b> page.</div>
  <div class="note"><b>&lt;style&gt; block</b> in the head<br>works, but "yuck"</div>
  <div class="note warn"><b>Inline</b> <code>style="..."</code><br>"you will burn alive"</div>
</div>
<h3>Syntax</h3>
<pre class="code">selector {
  property: value;   /* ; ends a declaration */
  property: value;
}                    /* { } group the rules for the selector */</pre>
<p>Most used properties: <code>color</code>, <code>background-color</code>, <code>background-image</code>, <code>border</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>margin</code>, <code>padding</code>, <code>text-align</code>, <code>width</code>, <code>display</code>, <code>flex</code>.</p>

<h3>Cascading = inheritance</h3>
<p>Some properties <b>pass down</b> to children automatically (auto-inherited), others don't.</p>
<div class="grid2">
  <div class="note good"><b>Inherited</b> (text stuff)<br><code>color</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>text-align</code>…</div>
  <div class="note"><b>Not inherited</b> (box stuff)<br><code>margin</code>, <code>padding</code>, <code>border</code>, <code>width</code>, <code>background-color</code>…</div>
</div>
<p class="small"><b>The background snag:</b> <code>background-color</code> is not inherited, but children look like they have it because their default background is <code>transparent</code>, so you see the parent's background through them.</p>
<div class="widget" data-w="inherit"></div>

<h3>Best practices</h3>
<ol>
  <li><b>Declare 4 things on <code>body</code></b>: <code>font-family</code>, <code>font-size</code>, <code>color</code>, <code>background-color</code>. They cascade down.</li>
  <li><b>Declare on the parent, overwrite on the child</b>: <code>section { font-size: 1.2rem }</code> + <code>section h2 { font-size: 3rem }</code>. Future-proof.</li>
  <li><b>Resize the container</b>, not every child: <code>section { width: 70% }</code>, not <code>section h2, section p, section ul { width: 70% }</code>.</li>
  <li><b>Auto-size images</b>: <code>img { max-width: 100% }</code> so they never overflow their container.</li>
  <li><b>Fallback fonts</b>: <code>font-family: Arial, Helvetica, sans-serif;</code>. The last one is always generic: <code>serif</code>, <code>sans-serif</code> or <code>monospace</code>.</li>
</ol>
<h3>Reset CSS</h3>
<p>Every browser has its own default styles. A <b>reset.css</b> (Howest uses <b>Eric Meyer's</b>) puts them all at the same baseline. Load it <b>first</b>, your own CSS after it, on every page:</p>
<pre class="code">&lt;link rel="stylesheet" type="text/css" href="reset.css"&gt;
&lt;link rel="stylesheet" type="text/css" href="screen.css"&gt;</pre>
<div class="quiz" data-c="css"></div>
</section>

<!-- CHAPTER: colours & units -->
<section class="ch" id="ch-units" data-title="Colours, units & clean CSS" data-n="04">
<h2>Colours, units & clean CSS</h2>
<p class="lead">How to write colours and sizes, and how to keep your CSS readable.</p>

<h3>Colours</h3>
<ul>
  <li><b>Named colours</b>: <code>black</code>, <code>white</code>, <code>red</code>, <code>hotpink</code>… fine for common colours.</li>
  <li><b>RGB</b>: amount of <b>R</b>ed, <b>G</b>reen and <b>B</b>lue, each from <b>0</b> (none) to <b>255</b> (full) → 256³ ≈ <b>16 million</b> colours. <code>rgb(255, 128, 0)</code></li>
  <li><b>Hex</b>: the same three numbers in hexadecimal, two digits each: <code>#FF8000</code> = R FF (255), G 80 (128), B 00 (0).</li>
</ul>
<div class="grid3">
  <div class="note"><code>#000000</code> black<br><code>#FFFFFF</code> white<br><code>#FF0000</code> red</div>
  <div class="note"><code>#00FF00</code> green<br><code>#0000FF</code> blue<br><code>#FFFF00</code> yellow (R+G)</div>
  <div class="note"><code>#FF00FF</code> magenta (R+B)<br><code>#00FFFF</code> cyan (G+B)<br><code>#202020</code> very dark grey</div>
</div>
<p class="small muted">Equal R, G and B = a shade of grey. Hex itself is explained in CAOS.</p>
<div class="widget" data-w="color"></div>

<h3>Units</h3>
<div class="grid2">
  <div class="note warn"><b>Absolute</b>: <code>px</code> <code>pt</code> <code>in</code> <code>cm</code> <code>mm</code> <code>Q</code> <code>pc</code><br>Fixed size: they ignore the user's font settings. "Absolute units are evil."</div>
  <div class="note good"><b>Relative</b>: <code>em</code> <code>rem</code> <code>vw</code> <code>vh</code> <code>%</code><br>Scale with the user/browser/parent. Always use <b>rem or em for font sizes</b>. Never <code>%</code> for font-size.</div>
</div>
<div class="grid2">
  <div class="note"><b>rem</b> = relative to the <b>root</b> (html) font size. Browser default 16px → <code>2rem</code> = 32px, <b>everywhere</b>.</div>
  <div class="note"><b>em</b> = relative to the <b>parent</b>'s font size, so it <b>compounds</b> when you nest: 1.5em inside 1.5em = 2.25× the root.</div>
</div>
<p class="small"><code>vw</code> / <code>vh</code> = 1% of the viewport width / height. <code>%</code> = percentage of the parent (great for widths).</p>
<div class="widget" data-w="remem"></div>

<h3>Clean CSS</h3>
<ul>
  <li><b>Plan first</b>: draw the blocks of the design on paper and decide the tags before you code.</li>
  <li><b>Structure your file</b> with comments, e.g. <code>/* HTML ELEMENTS */</code>, <code>/* REUSABLE CLASSES */</code>, <code>/* CONTAINING ELEMENTS */</code>, <code>/* PAGE SPECIFIC */</code>. Any logical structure is fine, as long as there is one.</li>
  <li><b>Naming convention</b>: camelCase, PascalCase, snake_case, kebab-case… In CSS, use <b>kebab-case</b> for ids and classes: <code>#main-nav</code>, <code>.promo-item</code>. Don't overcomplicate with BEM/SMACSS: KISS.</li>
  <li><b>IDs as hooks</b> (best practice #5): 4 similar sections that each need a different icon? Give each section an id (<code>#services</code>, <code>#products</code>) and style through it, instead of littering the HTML with classes.</li>
</ul>
<pre class="code">/* --- HTML ELEMENTS --- */
body { font-family: Arial, Helvetica, sans-serif; }

/* --- REUSABLE CLASSES --- */
.promo-item { background-color: gold; }

/* --- PAGE SPECIFIC --- */
#services h2 { background-image: url(../media/services.svg); }
#products h2 { background-image: url(../media/products.svg); }</pre>

<h3>Accessibility law</h3>
<p>The <b>European Accessibility Act</b> applies since <b>28 June 2025</b>: new products and services (websites included) must be accessible, also with assistive devices. It enforces <b>WCAG 2.1</b> (AA). WCAG 2.2 exists for those who want to do more than the minimum.</p>
<div class="quiz" data-c="units"></div>
</section>

<!-- CHAPTER 4 -->
<section class="ch" id="ch-sel" data-title="Selectors & specificity" data-n="05">
<h2>Selectors & specificity</h2>
<p class="lead">How to point at the right elements, and who wins when two rules fight.</p>
<div class="tbl"><table>
<tr><th>Selector</th><th>Example</th><th>Selects</th></tr>
<tr><td>element</td><td><code>h1</code></td><td>all h1's</td></tr>
<tr><td>class</td><td><code>.special</code></td><td>every element with class="special"</td></tr>
<tr><td>id</td><td><code>#products</code></td><td>the one element with id="products" (unique!)</td></tr>
<tr><td>list <code>,</code></td><td><code>h1, h2</code></td><td>h1's <b>and</b> h2's</td></tr>
<tr><td>descendant <code>(space)</code></td><td><code>nav a</code></td><td>a's <b>anywhere inside</b> nav (child, grandchild…) — <b>use this by default</b></td></tr>
<tr><td>child <code>&gt;</code></td><td><code>ul &gt; li</code></td><td>only <b>direct</b> children. Very restrictive, use with care.</td></tr>
<tr><td>next sibling <code>+</code></td><td><code>h1 + h2</code></td><td>the h2 <b>right after</b> an h1 (same parent)</td></tr>
<tr><td>subsequent sibling <code>~</code></td><td><code>h3 ~ p</code></td><td>every p <b>after</b> an h3 with the same parent (not necessarily right after)</td></tr>
<tr><td>joined</td><td><code>p.myclass</code></td><td>only <b>p</b> elements that have class myclass (no space!)</td></tr>
<tr><td>attribute</td><td><code>[alt]</code>, <code>img[alt]</code>, <code>img[alt="Jill"]</code></td><td>elements with that attribute (or that exact value)</td></tr>
<tr><td>pseudo-class <code>:</code></td><td><code>a:hover</code> <code>:visited</code> <code>:active</code> <code>input:focus</code> <code>li:first-child</code> <code>tr:nth-child(odd)</code></td><td>elements in a certain <b>state</b> or position</td></tr>
<tr><td>pseudo-element <code>::</code></td><td><code>p::first-letter</code> <code>::first-line</code> <code>::before</code> <code>::after</code> <code>::selection</code></td><td>a specific <b>part</b> of an element</td></tr>
</table></div>
<div class="note"><b>One colon vs two:</b> <code>:hover</code> = a state (pseudo-class, weight 10). <code>::first-letter</code> = a part (pseudo-element, weight 1). <code>p.intro</code> (joined, a p with class intro) is not the same as <code>p .intro</code> (something with class intro inside a p).</div>
<p class="small muted">Use <code>:first-child</code>, <code>:last-child</code>, <code>:nth-child(odd/even)</code> freely. <code>:nth-child(3)</code> for "the third item looks different"? Not future-proof: <b>use a class</b>.</p>
<div class="widget" data-w="selector"></div>

<h3>Specificity (weights)</h3>
<p>When rules conflict, the selector with the <b>highest weight</b> wins. Equal weight → the rule that comes <b>last</b> wins.</p>
<div class="grid3">
  <div class="note"><b>1</b><br>element / pseudo-element<br><code>p</code> <code>h2</code> <code>::before</code></div>
  <div class="note"><b>10</b><br>class / attribute / pseudo-class<br><code>.x</code> <code>[type]</code> <code>:hover</code></div>
  <div class="note"><b>100</b><br>id<br><code>#container</code></div>
</div>
<p class="small">Examples from the slides: <code>article h2</code> = 2 · <code>nav ul li a:hover</code> = 14 · <code>#container p.special</code> = 111 · <code>.flexcontainer article p:first-child span</code> = 23. Combinators (space, &gt;, +, ~) count 0.</p>
<div class="widget" data-w="spec"></div>
<h3>Who wins? (puzzles from the slides)</h3>
<p class="small">Calculate the weight of every rule that matches. Highest wins; on a tie the last rule wins. Watch out: a rule that doesn't match the element at all doesn't count, and links have their own colour from the browser.</p>
<div class="widget" data-w="puzzle"></div>
<div class="note"><b>Class or id?</b> Class = reusable, many elements. Id = exactly one unique element per page (also a link target with <code>#</code>). In CSS you'll mostly use classes.</div>
<div class="quiz" data-c="sel"></div>
</section>

<!-- CHAPTER 5 -->
<section class="ch" id="ch-box" data-title="Box model & display" data-n="06">
<h2>Box model & display</h2>
<p class="lead">Every element is a box. Layout = placing those boxes next to, below or inside each other.</p>
<h3>Display modes</h3>
<div class="tbl"><table>
<tr><th></th><th>block</th><th>inline</th><th>inline-block</th></tr>
<tr><td>Width by default</td><td>full width of its parent</td><td>as wide as its content</td><td>as wide as its content</td></tr>
<tr><td>Forces a new line?</td><td><b>yes</b></td><td>no</td><td>no</td></tr>
<tr><td>Vertical margin/padding?</td><td>yes</td><td><b>no</b> (only x-axis)</td><td>yes</td></tr>
<tr><td>width / height work?</td><td>yes</td><td><b>no</b></td><td>yes</td></tr>
<tr><td>Default for</td><td>div, p, h1–h6, ul, ol, li, all semantic containers</td><td>span, a, strong, em</td><td>img</td></tr>
</table></div>
<div class="widget" data-w="display"></div>

<h3>The box</h3>
<p>From inside to outside: <b>content</b> → <b>padding</b> (space inside the box) → <b>border</b> → <b>margin</b> (space outside, towards the neighbours). Think of a garden: the plants are the content, the lawn around them is padding, the fence is the border and the gap to the neighbour's fence is the margin.</p>
<div class="formula">total visual width = width + padding (left + right) + border (left + right)<br><span class="muted small">margin is not part of it; it's the space around the box</span></div>
<p>The background fills the content <b>and</b> the padding (and runs under the border; the border is drawn on top).</p>
<div class="widget" data-w="box"></div>
<h3>box-sizing</h3>
<div class="grid2">
  <div class="note"><b>content-box</b> (standard)<br><code>width</code> = only the content. Padding and border come <b>on top</b>.<br><span class="small">20rem + 2rem padding + 2×1rem border = <b>24rem</b></span></div>
  <div class="note"><b>border-box</b><br><code>width</code> = the total visual width. Padding and border are taken <b>out of it</b>.<br><span class="small">20rem = 2rem + 2×1rem + <b>16rem</b> content</span></div>
</div>
<p class="small muted">Only change box-sizing when you really need to; switching it around casually confuses other developers.</p>

<h3>Sizing</h3>
<p><code>width</code>, <code>min-width</code>, <code>max-width</code>, <code>height</code>, <code>min-height</code>, <code>max-height</code>. Classic responsive container: <code>width: 90%; max-width: 60rem; margin: 0 auto;</code> → grows and shrinks with the screen, stops at 60rem, centered.</p>

<h3>Collapsing margins</h3>
<p>When two vertical margins touch, they don't add up: the <b>biggest one wins</b>.</p>
<div class="widget" data-w="collapse"></div>
<ul class="small">
  <li>Also happens between a parent and its first/last child (margin-top 1rem + child margin-top 2rem → 2rem at the top).</li>
  <li>Only when they really touch: a border, padding or content in between stops the collapsing.</li>
  <li>Inside a <b>flex</b> container margins do <b>not</b> collapse.</li>
</ul>
<div class="quiz" data-c="box"></div>
</section>

<!-- CHAPTER 6 -->
<section class="ch" id="ch-flex" data-title="Layout & flexbox" data-n="07">
<h2>Layout & flexbox</h2>
<p class="lead">In this course only two layout techniques are allowed: <b>inline-block</b> and <b>flexbox</b>.</p>
<div class="tbl"><table>
<tr><th>Technique</th><th>Verdict</th></tr>
<tr><td>float</td><td>only meant to let text wrap around an image. Never for layout.</td></tr>
<tr><td>position (absolute…)</td><td>only for elements that go "off-grid". Never for a full layout.</td></tr>
<tr><td>display: table</td><td>obsolete, don't use</td></tr>
<tr><td><b>inline-block</b></td><td>small things side by side (figures, list items) when spacing doesn't matter. Problem: <b>whitespace</b> in the HTML shows up as a gap; no equal heights.</td></tr>
<tr><td><b>flexbox</b></td><td>everything else: nav bars, rows of cards, components, centering. Positions on <b>one axis</b>.</td></tr>
<tr><td>grid</td><td>two axes, whole page layouts (semester 2)</td></tr>
</table></div>
<h3>Container vs items</h3>
<p>You put <code>display: flex</code> on the <b>container</b>. Its <b>direct children</b> become flex items.</p>
<pre class="code">main { display: flex; }      /* main = container, its articles = items */</pre>
<div class="tbl"><table>
<tr><th>On the container</th><th>What it does</th></tr>
<tr><td><code>flex-direction</code></td><td><code>row</code> (default) | <code>row-reverse</code> | <code>column</code> | <code>column-reverse</code></td></tr>
<tr><td><code>flex-wrap</code></td><td><code>nowrap</code> (default, items squeeze on one line) | <code>wrap</code> | <code>wrap-reverse</code></td></tr>
<tr><td><code>flex-flow</code></td><td>shorthand for direction + wrap: <code>flex-flow: row wrap</code></td></tr>
<tr><td><code>gap</code></td><td>space between items: <code>gap: 1rem</code> or <code>gap: 1rem 2rem</code> (row-gap column-gap)</td></tr>
<tr><td><code>justify-content</code></td><td>align on the <b>main axis</b>: flex-start, center, flex-end, space-between, space-around, space-evenly</td></tr>
<tr><td><code>align-items</code></td><td>align on the <b>cross axis</b>: stretch (default → equal heights!), center, flex-start, flex-end</td></tr>
<tr><td><code>align-content</code></td><td>cross axis for <b>multiple wrapped lines</b></td></tr>
<tr><th>On an item</th><th></th></tr>
<tr><td><code>align-self</code></td><td>exception on the cross axis for one item</td></tr>
<tr><td><code>flex-grow</code></td><td>how much of the <b>extra space</b> it gets (default 0 = no growing)</td></tr>
<tr><td><code>flex-shrink</code></td><td>how much it shrinks when there's not enough space (0 = never smaller than its basis)</td></tr>
<tr><td><code>flex-basis</code></td><td>the ideal starting size. Use it instead of <code>width</code> (if both are set, flex-basis wins)</td></tr>
<tr><td><code>flex</code></td><td>shorthand: <code>flex: grow shrink basis</code> → <code>flex: 0 0 50%</code>. Don't leave out the basis.</td></tr>
</table></div>
<div class="note"><b>Axes flip!</b> With <code>flex-direction: column</code> the main axis is vertical, so <code>justify-content</code> works vertically and <code>align-items</code> horizontally.</div>
<div class="widget" data-w="flex"></div>
<h3>How flex-grow divides space</h3>
<div class="formula">item width = (flex-grow ÷ total flex-grow) × available space + initial width</div>
<p class="small">Slide example: container has 730px free, item 1 has <code>flex: 3 1 30rem</code> (480px), items 2 and 3 have <code>flex: 1 1 auto</code> (75px each). Item 1 = 3/5 × 730 + 480 = <b>918px</b>. flex-grow does <b>not</b> make items equal: it shares the <i>extra</i> space.</p>
<div class="widget" data-w="grow"></div>
<ul class="small">
  <li><b>Auto margins</b> in a flex item push in any direction: <code>margin-left: auto</code> pushes an item to the far right (classic nav trick). Margins beat the alignment properties.</li>
  <li><b>Centering</b> something horizontally and vertically: <code>display:flex; justify-content:center; align-items:center;</code>. A block horizontally: <code>margin: 0 auto</code> + a width.</li>
</ul>
<div class="quiz" data-c="flex"></div>
</section>

<!-- CHAPTER 7 -->
<section class="ch" id="ch-forms" data-title="Forms & accessibility" data-n="08">
<h2>Forms & accessibility</h2>
<p class="lead">Forms collect user data and send it to the server.</p>
<pre class="code">&lt;form action="login.php" method="post"&gt;
  &lt;label for="user"&gt;User&lt;/label&gt;
  &lt;input type="text" name="user" id="user"&gt;
  &lt;label for="pw"&gt;Password&lt;/label&gt;
  &lt;input type="password" name="pw" id="pw"&gt;
  &lt;input type="submit" value="Login"&gt;
&lt;/form&gt;</pre>
<ul>
  <li><code>action</code> = the script that handles the data. <code>method</code> = <code>get</code> or <code>post</code>.</li>
  <li><b>Every form element belongs inside a <code>&lt;form&gt;</code></b>, otherwise it's not sent.</li>
  <li><b><code>name</code></b> is what's sent to the server (mandatory). <b><code>id</code></b> is never sent: it's for CSS, JS and labels. Good practice: same value for both.</li>
  <li><b><code>&lt;label for="x"&gt;</code></b> links to the input with <code>id="x"</code>: screen readers read it and clicking the label focuses/checks the input.</li>
  <li><b>Radio buttons / checkboxes are grouped by the same <code>name</code></b>. Different names = they don't belong together (you could select both "male" and "female"). Checkbox groups often use <code>name="vehicle[]"</code>.</li>
  <li>The <code>value</code> is what gets sent, so keep it language-agnostic (<code>value="female"</code>, not the translated label text).</li>
  <li>Selected by default: <code>checked</code> for radio/checkbox, <code>selected</code> for an <code>&lt;option&gt;</code>.</li>
  <li><code>placeholder</code> = grey hint text, disappears when you type, <b>not sent</b>. <code>value</code> = real pre-filled content that <b>is</b> sent.</li>
  <li><code>&lt;fieldset&gt;</code> (+ <code>&lt;legend&gt;</code>) groups related fields in long forms. Only inside forms.</li>
</ul>
<div class="widget" data-w="form"></div>
<h3>Submit vs button</h3>
<div class="grid2">
  <div class="note good"><b>Sends the form</b> (works even without JavaScript):<br><code>&lt;input type="submit"&gt;</code> · <code>&lt;button&gt;</code> · <code>&lt;button type="submit"&gt;</code></div>
  <div class="note warn"><b>Does nothing without JS:</b><br><code>&lt;button type="button"&gt;</code> · <code>&lt;input type="button"&gt;</code><br>Only OK for extra, non-critical features.</div>
</div>
<ul class="small">
  <li><code>&lt;input type="reset"&gt;</code> clears the form. Leave it out unless people fill in the same form over and over (too easy to hit by accident).</li>
  <li><b>Link or button?</b> Link (<code>&lt;a&gt;</code>) = go somewhere (new page/section, Enter key). Button = do an action (send, open, close; Space key).</li>
  <li>HTML validation (<code>required</code>, <code>type="email"</code>, <code>min</code>, <code>pattern</code>…) gives quick feedback, but it is <b>not secure one bit</b>: always validate on the server too.</li>
  <li>Check browser support on <b>caniuse.com</b>.</li>
</ul>
<h3>Accessibility (a11y)</h3>
<p>Make things usable for <b>everyone</b>: vision (low vision, contrast, colour blindness: very common in men), hearing, touch, mobility, speech, cognitive. Often it's the situation: sunlight on your phone, a noisy train station, running for a train. EU law requires <b>WCAG 2.1 level AA</b>. Unobtrusive JS: the page must still work when JavaScript fails.</p>
<div class="quiz" data-c="forms"></div>
</section>

<!-- CHAPTER 8 -->
<section class="ch" id="ch-http" data-title="HTTP request & response" data-n="09">
<h2>HTTP request & response</h2>
<p class="lead">Every page load is a conversation: the client <b>requests</b>, the server <b>responds</b>.</p>
<div class="grid2">
  <div class="note"><b>Client side</b> (runs in the browser)<br>HTML, CSS, JavaScript</div>
  <div class="note"><b>Server side</b> (runs on the server)<br>PHP, Python, .NET…</div>
</div>
<h3>A request</h3>
<pre class="code">GET /index.html HTTP/1.1        ← method · request target · protocol
Host: localhost:5000            ← headers (Host is mandatory in HTTP/1.1)
Accept-Language: en-GB</pre>
<p class="small"><b>Origin form</b>: <code>GET /index.html HTTP/1.1</code> (path only). <b>Absolute form</b>: <code>GET http://localhost:5000/index.html HTTP/1.1</code> (full URL).</p>
<div class="tbl"><table>
<tr><th>Method</th><th>Does</th><th>Idempotent</th><th>Safe</th></tr>
<tr><td><b>GET</b></td><td>retrieve (read-only)</td><td>yes</td><td>yes</td></tr>
<tr><td><b>POST</b></td><td>submit / create</td><td>no</td><td>no</td></tr>
<tr><td>PUT</td><td>replace</td><td>yes</td><td>no</td></tr>
<tr><td>PATCH</td><td>partial change</td><td>no</td><td>no</td></tr>
<tr><td>DELETE</td><td>remove</td><td>yes</td><td>no</td></tr>
</table></div>
<p class="small"><b>Idempotent</b> = doing it 10 times has the same effect as once (deleting user 123 twice: still gone). POST /payment twice = charged twice → not idempotent.</p>
<h3>GET vs POST</h3>
<div class="grid2">
  <div class="note"><b>GET</b>: data in the <b>query string</b> of the URL<br><code>https://example.com/page?name=dog&amp;color=black</code><br><span class="small"><code>?</code> starts it, <code>key=value</code> pairs, joined with <code>&amp;</code></span></div>
  <div class="note"><b>POST</b>: data in the <b>request body</b> (payload / form data), type given by the <code>Content-Type</code> header (forms: <code>application/x-www-form-urlencoded</code>)</div>
</div>
<div class="note warn">Is POST more secure because you don't see the data in the URL? <b>No!</b> Hiding ≠ securing.</div>
<div class="widget" data-w="http"></div>
<h3>Headers</h3>
<p>Headers are <b>metadata</b> sent along, not the data itself.</p>
<div class="grid2">
  <div class="note"><b>Request headers</b><br><code>Host</code> server domain (mandatory) · <code>Accept</code> types the client understands · <code>Accept-Language</code> · <code>Content-Type</code> format of the body (absent if no body) · <code>Authorization</code> credentials · <code>Referer</code> previous page · <code>User-Agent</code> browser/OS info</div>
  <div class="note"><b>Response headers</b><br><code>Content-Type</code> media type returned · <code>Content-Encoding</code> how to decode · <code>Date</code> · <code>Server</code> server software · <code>Set-Cookie</code> server sends a cookie · (<code>Cookie</code> = the client sending it back)</div>
</div>
<h3>The response</h3>
<pre class="code">HTTP/1.1 200 OK          ← protocol · status code · reason phrase</pre>
<div class="tbl"><table>
<tr><th>Code</th><th>Meaning</th></tr>
<tr><td>1xx / 2xx / 3xx / 4xx / 5xx</td><td>info / success / redirect / <b>client</b> error / <b>server</b> error</td></tr>
<tr><td><b>200</b> OK</td><td>processed fine. Not proof the page is correct (an error message can come with a 200).</td></tr>
<tr><td><b>401</b> Unauthorized</td><td>no or wrong credentials → really an <b>authentication</b> problem</td></tr>
<tr><td><b>403</b> Forbidden</td><td>you're known but not allowed → <b>authorization</b> problem</td></tr>
<tr><td><b>404</b> Not Found</td><td>nothing at that URL</td></tr>
<tr><td><b>418</b> I'm a teapot</td><td>April Fools' joke code</td></tr>
<tr><td><b>500</b> Internal Server Error</td><td>the server crashed on something (catch-all)</td></tr>
<tr><td><b>503</b> Service Unavailable</td><td>temporarily can't handle it (overload, maintenance)</td></tr>
</table></div>
<div class="note"><b>Attacker mindset:</b> status codes and headers leak info. 404s map a site, 403 says "this folder exists", 500 error pages and <code>Server</code> headers reveal the tech stack, a 200 on <code>/admin</code> is jackpot. Blindly trusting <code>Content-Type</code> led to the Equifax hack (Apache Struts, CVE-2017-5638).</div>
<div class="quiz" data-c="http"></div>
</section>

</table></div>
<div class="note"><b>What they focus on:</b> valid vs invalid code · the right semantic tag · selectors · box model (margin/padding/width/height) · inline-block vs flex for side by side · a <b>box</b> (block) vs <b>text</b> (inline) · how the cascade works · deep understanding of the request/response cycle. MDN is your go-to source.</div>

<h3>Terminology & HTML basics</h3>
<ul>
  <li><b>Internet</b> = the global network of computers. <b>Web (WWW)</b> = the pages and links you reach over it with HTTP.</li>
  <li><b>Client</b> = the browser that <b>requests</b> · <b>server</b> = the computer that <b>responds</b>. The browser <b>renders</b> (draws) HTML + CSS and runs JS.</li>
  <li><b>HTML</b> = structure and content · <b>CSS</b> = presentation (looks) · <b>JavaScript</b> = behaviour. Front-end = what runs in the browser; back-end = what runs on the server.</li>
  <li><b>Element</b> = start tag + content + end tag: <code>&lt;p&gt;Hi&lt;/p&gt;</code>. <b>Attribute</b> = extra info in the start tag: <code>name="value"</code>.</li>
  <li><b>Void (empty) elements</b> have no end tag: <code>img</code>, <code>br</code>, <code>hr</code>, <code>input</code>, <code>link</code>, <code>meta</code>.</li>
  <li><b>Nesting</b>: close in reverse order. <code>&lt;p&gt;&lt;em&gt;hi&lt;/em&gt;&lt;/p&gt;</code> ✓ · <code>&lt;p&gt;&lt;em&gt;hi&lt;/p&gt;&lt;/em&gt;</code> ✗</li>
  <li>Every page: <code>&lt;!DOCTYPE html&gt;</code> → <code>&lt;html lang="en"&gt;</code> → <code>&lt;head&gt;</code> (meta charset, title, link to CSS) + <code>&lt;body&gt;</code> (everything you see).</li>
  <li>Comments: <code>&lt;!-- ... --&gt;</code> in HTML, <code>/* ... */</code> in CSS. Special characters: <code>&amp;lt;</code> &lt; · <code>&amp;gt;</code> &gt; · <code>&amp;amp;</code> &amp; · <code>&amp;nbsp;</code> non-breaking space · <code>&amp;copy;</code> ©.</li>
  <li><b>Valid code</b> follows the standard (check with the W3C validator). Browsers <b>forgive</b> mistakes and still show something, so "it looks fine" doesn't mean it's valid.</li>
  <li><b>URL anatomy</b>: <code>https://</code> protocol · <code>www.shop.be</code> host · <code>:443</code> port · <code>/products/list.html</code> path · <code>?id=4&amp;c=red</code> query string · <code>#reviews</code> fragment (never sent to the server).</li>
</ul>
<pre class="code">&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8"&gt;
  &lt;title&gt;My page&lt;/title&gt;
  &lt;link rel="stylesheet" href="css/screen.css"&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>

<h3>Tables: rowspan & colspan</h3>
<ul>
  <li><code>colspan="3"</code> = the cell spans <b>3 columns</b> (horizontally).</li>
  <li><code>rowspan="5"</code> = the cell spans <b>5 rows</b> (vertically).</li>
  <li><code>&lt;caption&gt;</code> = the title of the table (first thing inside <code>&lt;table&gt;</code>). <code>&lt;th scope="col"&gt;</code> / <code>scope="row"</code> tells screen readers what the header belongs to.</li>
</ul>
<pre class="code">&lt;tr&gt;
  &lt;th rowspan="5"&gt;Class schedule&lt;/th&gt;   &lt;!-- one cell, 5 rows high --&gt;
&lt;/tr&gt;</pre>

<h3>CSS custom properties (variables)</h3>
<p>A <b>custom property</b> stores a value once so you can reuse it everywhere. Change it in one place → it changes everywhere.</p>
<pre class="code">:root {                       /* :root = the html element → available everywhere */
  --main-color: #0a7a55;
  --gap: 1.5rem;
}
h1 { color: var(--main-color); }
.card { margin-bottom: var(--gap); border: 2px solid var(--main-color); }
.btn { background-color: var(--accent, orange); }   /* fallback if --accent doesn't exist */
.dark-section { --main-color: white; }              /* redefine → only inside this section */</pre>
<ul>
  <li>The name <b>must start with two dashes</b>: <code>--main-color</code>. Names are <b>case-sensitive</b> (<code>--Color</code> ≠ <code>--color</code>).</li>
  <li>Use it with <code>var(--name)</code>; a second value is the <b>fallback</b>: <code>var(--accent, orange)</code>.</li>
  <li>Custom properties <b>cascade and inherit</b>: declared on <code>:root</code> = global; declared on a selector = for that element and its descendants; a closer declaration overrides.</li>
  <li>Only for <b>values</b>: you can't use them as a property name or selector.</li>
</ul>

<h3>CSS positioning techniques</h3>
<p>The techniques: <code>display: inline-block</code>, <code>display: flex</code>, <code>display: grid</code>, <code>position: …</code>, <code>float: …</code> (and the old <code>display: table</code>). In this course you use <b>inline-block</b> and <b>flex</b>.</p>
<div class="note warn"><b>Trick options:</b> <code>display: position</code>, <code>display: float</code>, <code>display: table-grid</code>, <code>display: content-oneline</code> and <code>display: border-box</code> <b>don't exist</b>. position and float are their own properties, and border-box belongs to box-sizing.</div>
<p><b>Box vs text:</b> <code>a</code> elements are inline (text). If you see anchors side by side <b>with a width and a border all around</b>, they must be <code>display: inline-block</code> (inline ignores width; block would put each on its own line).</p>

<h3>Reading HTTP readouts (network panel)</h3>
<div class="grid2">
  <div class="note"><b>Request</b> starts with <b>METHOD path protocol</b><br><code>GET / HTTP/2</code><br>then request headers: Host, User-Agent, Accept, Accept-Language, Accept-Encoding, Cookie…</div>
  <div class="note"><b>Response</b> starts with <b>protocol + status code</b><br><code>HTTP/2 200</code> (HTTP/2 has no reason phrase) or <code>HTTP/1.1 200 OK</code><br>then response headers: server, date, content-type, set-cookie…</div>
</div>
<div class="tbl"><table>
<tr><th>Header</th><th>What it tells you</th></tr>
<tr><td><code>Host: www.polygon.com</code></td><td>the application/site being requested</td></tr>
<tr><td><code>User-Agent</code></td><td>browser + OS of the user. All start with <code>Mozilla/5.0</code> (history). Look for: <b>Firefox/</b> (+ <code>Gecko/20100101</code>, <code>rv:</code>) = Firefox · <b>Edg/</b> = Edge · <b>Chrome/</b> without Edg = Chrome · <b>Version/… Safari/</b> without Chrome = Safari. Missing header = browser not visible.</td></tr>
<tr><td><code>Accept-Language: en-US,en;q=0.9</code></td><td>preferred language: <b>en-US</b> first; <code>q</code> = weight from 0 to 1 (lower = less preferred)</td></tr>
<tr><td><code>Accept-Encoding: gzip, deflate, br, zstd</code></td><td>compression methods the browser can unpack</td></tr>
<tr><td><code>server: nginx</code></td><td>the web server software (response header)</td></tr>
<tr><td><code>date</code></td><td>when the response was generated</td></tr>
</table></div>
<pre class="code">GET / HTTP/2                              ← a REQUEST, HTTP version 2
Host: www.polygon.com                     ← application requested: www.polygon.com
User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:158.0) Gecko/20100101 Firefox/158.0
                                          ← browser IS visible: Firefox on macOS
Accept-Language: en-US,en;q=0.9           ← expected language: en-US</pre>

<h3>Passwords in a GET URL</h3>
<ul>
  <li>A GET form puts the password in the URL: <code>login.php?user=ann&amp;pw=secret</code>.</li>
  <li>✓ The URL is stored in the <b>browser history</b>. ✓ It can end up in <b>server logs</b> (and proxy logs, the Referer header, screenshots…).</li>
  <li>✗ <b>Percent-encoding</b> (<code>%20</code> for a space…) only makes characters URL-safe: it's <b>not encryption</b>. ✗ <code>type="password"</code> only <b>hides the dots on screen</b>, it doesn't encrypt anything. ✗ The password does <b>not</b> disappear from the URL after loading.</li>
  <li>Correct: <b>method="post"</b> (data in the body) <b>+ HTTPS</b> (encrypts the whole request in transit).</li>
</ul>
<div class="quiz" data-c="extra"></div>
</section>

<template id="notes-ur"><!-- CHAPTER 1 -->
<section class="ch" id="ch-links" data-title="Links, tables & images" data-n="01">
<h2>Links, tables & images</h2>
<p class="lead">Page doosri cheezon ko kaise point karta hai, tabular data kaise dikhate hain, aur kaunsa image format kab use karna hai.</p>

<h3>Links</h3>
<p>Link ek <code>&lt;a&gt;</code> (anchor) tag hai. <code>href</code> = link kahan jayega. Tags ke beech wala text = jis par user click karta hai.</p>
<pre class="code">&lt;a href="mypage.html"&gt;Go there!&lt;/a&gt;</pre>
<div class="grid2">
  <div class="note"><b>Absolute link</b> (apni site ke andar): <code>/</code> se shuru hota hai aur hamesha site ke <em>root</em> (sab se upar wale folder) se dekha jata hai.<br><code>/pages/products.html</code></div>
  <div class="note"><b>Relative link</b>: us file se shuru hota hai jis mein aap ho. <b>Yehi behtar hai.</b><br><code>pages/products.html</code> · <code>../</code> = ek folder upar</div>
</div>
<ul>
  <li>Doosri website: <code>href="https://www.google.com"</code> (ya <code>//www.google.com</code>). Rule: doosri website hamesha <b>new tab</b> mein kholo.</li>
  <li>Kabhi bhi apne computer ki file ka link mat do, jaise <code>C:\My Documents\file.htm</code>.</li>
  <li>Usi page ke kisi hisse par jump: target ko <code>id</code> do aur <code>#</code> se link karo: <code>&lt;a href="#info"&gt;</code> → <code>&lt;h1 id="info"&gt;</code>.</li>
  <li><em>Doosre</em> page ka koi hissa: dono mila do: <code>href="about.html#team"</code>.</li>
</ul>
<div class="widget" data-w="paths"></div>

<h3>Tables</h3>
<p>Sirf <b>tabular data</b> ke liye (jo cheez aap Excel mein likhte, woh table hai). Layout ke liye table <b>kabhi nahi</b>. Pehle <b>rows</b> mein socho: ek <code>&lt;tr&gt;</code> band karo phir agla shuru karo, aur har row mein cells barabar hone chahiye.</p>
<pre class="code">&lt;table&gt;
  &lt;thead&gt;
    &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;Score&lt;/th&gt;&lt;/tr&gt;
  &lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Anna&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
  &lt;tfoot&gt;
    &lt;tr&gt;&lt;td&gt;Average&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;
  &lt;/tfoot&gt;
&lt;/table&gt;</pre>
<p class="small muted"><code>th</code> = heading wala cell, <code>td</code> = data cell, <code>tr</code> = table row.</p>

<h3>Images</h3>
<pre class="code">&lt;img src="cat.jpg" alt="A grey cat sleeping" title="Our cat"&gt;</pre>
<ul>
  <li><code>src</code> = image ka rasta (relative link behtar). <code>alt</code> = <b>zaroori</b> hai: jab image load na ho to yeh text dikhta hai, aur screen reader (andhay logon ka software) yehi parhta hai. <code>title</code> = mouse le jao to tooltip.</li>
  <li><b>Content images</b> (jin ka matlab hai) <b>HTML</b> mein. <b>Sajawat wali</b> (background, design) <b>CSS</b> mein.</li>
  <li>Bitmap image choti ho sakti hai, bari karo to kharab ho jati hai. <b>Kabhi bhi lambai/chaurai ka tanasub (ratio) mat bigaro.</b></li>
  <li>Image ke neeche caption hamesha dikhana hai? <code>&lt;figure&gt;</code> + <code>&lt;img&gt;</code> + <code>&lt;figcaption&gt;</code>.</li>
</ul>
<pre class="code">&lt;figure&gt;
  &lt;img src="cat.jpg" alt="A grey cat sleeping"&gt;
  &lt;figcaption&gt;Our cat after exam week&lt;/figcaption&gt;
&lt;/figure&gt;</pre>

<h3>Image formats</h3>
<div class="tbl"><table>
<tr><th></th><th>Kis qisam ka</th><th>Compression</th><th>Transparency</th><th>Animation</th><th>Kab use karo</th></tr>
<tr><td><b>JPEG</b></td><td>bitmap, poore rang</td><td>lossy</td><td>nahi</td><td>nahi</td><td>photos, har browser mein chalta hai</td></tr>
<tr><td><b>GIF</b></td><td>bitmap, sirf 256 rang</td><td>lossy (kamzor)</td><td>sirf 1 rang (haan/na)</td><td><b>haan</b></td><td>ek jaisay rang wale hissay, simple animation</td></tr>
<tr><td><b>PNG</b></td><td>bitmap, poore rang</td><td><b>lossless</b></td><td><b>haan</b> (asli)</td><td>nahi (sirf APNG)</td><td>transparency chahiye, file bari hoti hai</td></tr>
<tr><td><b>WebP</b></td><td>bitmap (Google ka)</td><td>lossy ya lossless</td><td>haan</td><td>haan</td><td>har kaam ka naya format</td></tr>
<tr><td><b>AVIF</b></td><td>bitmap (AV1)</td><td>lossy ya lossless, sab se behtar</td><td>haan</td><td>haan</td><td>behtareen photo quality, choti file, har browser mein nahi</td></tr>
<tr><td><b>SVG</b></td><td><b>vector</b></td><td>(shapes calculate hoti hain)</td><td>haan</td><td>CSS/JS ke saath</td><td>logo, icons, jitna bara karo kharab nahi hota</td></tr>
</table></div>
<ul class="small">
  <li><b>Lossy</b> = data hamesha ke liye nikal deta hai (wapas nahi aata). <b>Lossless</b> = sirf faltu data nikalta hai (wapas aa sakta hai).</li>
  <li><b>Gamut</b> = kitne rang mojood hain. <b>Bit depth</b> = un rangon ke beech kitne bareek steps hain.</li>
  <li><b>Icon fonts</b>: aise fonts jin mein letters ki jagah symbols hain. Vector hain, 1 request mein saikron icons, text ki tarah size/rang badal jata hai, sirf simple images.</li>
  <li>Jaldi faisla: purane browsers bhi chahiye → <b>JPEG</b> · har kaam ka → <b>WebP</b> · behtareen photo + choti file → <b>AVIF</b>.</li>
</ul>

<h3>&lt;picture&gt; aur progressive enhancement</h3>
<p><b>Progressive enhancement</b> = jo browser naya format samajhta hai usay naya do, baqi sab ko ek <b>fallback</b> (backup) do. Images ke liye yeh <code>&lt;picture&gt;</code> se hota hai:</p>
<pre class="code">&lt;picture&gt;
  &lt;source srcset="art.avif" type="image/avif"&gt;
  &lt;source srcset="art.webp" type="image/webp"&gt;
  &lt;img src="art.jpg" alt="Art" title="Art"&gt;
&lt;/picture&gt;</pre>
<ul>
  <li>Browser <b>pehla</b> <code>&lt;source&gt;</code> leta hai jo usay samajh aaye. <b>Tarteeb (order) zaroori hai!</b></li>
  <li>Andar wala <code>&lt;img&gt;</code> <b>zaroori</b> hai: screen reader alt/title usi se parhta hai, aur purana browser wohi dikhata hai.</li>
</ul>
<div class="widget" data-w="picture"></div>
<div class="quiz" data-c="links"></div>
</section>

<!-- CHAPTER 2 -->
<section class="ch" id="ch-sem" data-title="Semantic HTML" data-n="02">
<h2>Semantic HTML</h2>
<p class="lead">Semantics = code ka <em>matlab</em> kya hai, yeh nahi ke dikhta kaisa hai. Is se browser, screen reader aur Google ko samajh aata hai ke page mein kya hai.</p>
<div class="widget" data-w="layout"></div>
<div class="tbl"><table>
<tr><th>Tag</th><th>Matlab</th><th>Yaad rakhne wale rules</th></tr>
<tr><td><code>header</code></td><td>shuru wala hissa (title, logo, aksar nav bhi)</td><td>kai ho sakte hain, zyada mat use karo</td></tr>
<tr><td><code>nav</code></td><td>main ya sub navigation (menu)</td><td>har links ki list ke liye nahi</td></tr>
<tr><td><code>main</code></td><td>page ka asli/main content</td><td><b>page mein sirf ek</b>; article, header, footer, aside ya nav ke andar kabhi nahi</td></tr>
<tr><td><code>section</code></td><td>ek mauzu (topic) ka group: chapter, tab</td><td><b>heading zaroori</b> (h1–h6); yeh "naya div" nahi hai</td></tr>
<tr><td><code>article</code></td><td>aisa content jo akela bhi samajh aaye (blog post, news, card jo share ho sake)</td><td>andar article ho sakta hai (comments)</td></tr>
<tr><td><code>aside</code></td><td>side wali, thori si mutaliq cheez (sidebar, related articles, banner)</td><td></td></tr>
<tr><td><code>footer</code></td><td>page ya kisi hissay ka neeche wala hissa</td><td>kai ho sakte hain</td></tr>
<tr><td><code>div</code> / <code>span</code></td><td>koi matlab nahi</td><td>sirf <b>design</b> ke liye group karna ho: block ke liye div, text ke andar span</td></tr>
</table></div>
<div class="grid2">
  <div class="note"><b>em vs strong vs span</b><br><code>em</code> = zor de kar bolna (emphasis), <code>strong</code> = ahem cheez (importance). Dono matlab add karte hain. <code>span</code> koi matlab nahi deta.</div>
  <div class="note"><b>Aur tags jo dekhe</b><br><code>figure</code>/<code>figcaption</code>, <code>time</code>, <code>address</code>, <code>blockquote</code>, <code>cite</code>, <code>abbr</code>, <code>code</code>, <code>mark</code>, <code>details</code>/<code>summary</code>, <code>fieldset</code> (sirf forms mein).</div>
</div>
<h3>Valid HTML</h3>
<ul>
  <li>Hamesha page ko <b>W3C validator</b> (validator.w3.org) se check karo. Wohi count hota hai.</li>
  <li>Headings kitaab ki fehrist (table of contents) ki tarah honi chahiye: <code>h1 → h2 → h3</code>. <code>h1</code> ke foran baad <code>h3</code> = <b>invalid</b>. Alag dikhana hai to CSS se karo.</li>
  <li><code>id</code> poore page mein sirf ek baar.</li>
</ul>
<pre class="code">&lt;!-- NOT valid --&gt;        &lt;!-- valid --&gt;
&lt;h1&gt;Title&lt;/h1&gt;             &lt;h1&gt;Title&lt;/h1&gt;
&lt;h3&gt;Sub&lt;/h3&gt;               &lt;h2&gt;Sub&lt;/h2&gt;
&lt;h2&gt;Sub&lt;/h2&gt;               &lt;h3&gt;Sub sub&lt;/h3&gt;</pre>
<div class="note warn"><b>Yeh kabhi mat karna:</b> <code>&lt;div class="header"&gt;</code>, <code>&lt;div class="main"&gt;</code>… Agar us kaam ka semantic tag mojood hai, to wohi use karo.</div>
<div class="quiz" data-c="sem"></div>
</section>

<!-- CHAPTER 3 -->
<section class="ch" id="ch-css" data-title="CSS basics & cascading" data-n="03">
<h2>CSS basics & cascading</h2>
<p class="lead">CSS kahan likhte hain, ek rule kaise banta hai, aur "cascading" ka asli matlab kya hai.</p>
<h3>CSS lagane ke 3 tareeqe</h3>
<div class="grid3">
  <div class="note good"><b>Alag file</b> ✓ sahi tareeqa<br><code>&lt;link rel="stylesheet" type="text/css" href="screen.css"&gt;</code> <b>har</b> page ke <code>&lt;head&gt;</code> mein.</div>
  <div class="note"><b>&lt;style&gt; block</b> head mein<br>chal jata hai, lekin "yuck"</div>
  <div class="note warn"><b>Inline</b> <code>style="..."</code><br>"you will burn alive" 😅</div>
</div>
<h3>Syntax (likhne ka tareeqa)</h3>
<pre class="code">selector {
  property: value;   /* ; ek line khatam karta hai */
  property: value;
}                    /* { } selector ke saare rules ko group karte hain */</pre>
<p>Sab se zyada use hone wali properties: <code>color</code>, <code>background-color</code>, <code>background-image</code>, <code>border</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>margin</code>, <code>padding</code>, <code>text-align</code>, <code>width</code>, <code>display</code>, <code>flex</code>.</p>

<h3>Cascading = inheritance (wirasat)</h3>
<p>Kuch properties parent se bachon (children) ko <b>khud ba khud mil jati hain</b>, kuch nahi milti.</p>
<div class="grid2">
  <div class="note good"><b>Inherit hoti hain</b> (text wali)<br><code>color</code>, <code>font-family</code>, <code>font-size</code>, <code>line-height</code>, <code>text-align</code>…</div>
  <div class="note"><b>Inherit nahi hoti</b> (box wali)<br><code>margin</code>, <code>padding</code>, <code>border</code>, <code>width</code>, <code>background-color</code>…</div>
</div>
<p class="small"><b>Background wala chakkar:</b> <code>background-color</code> inherit nahi hota, lekin bachay usi rang ke lagte hain kyunke unka apna background <code>transparent</code> (sheesha) hota hai, to parent ka rang peeche se nazar aata hai.</p>
<div class="widget" data-w="inherit"></div>

<h3>Best practices</h3>
<ol>
  <li><b><code>body</code> par 4 cheezein likho</b>: <code>font-family</code>, <code>font-size</code>, <code>color</code>, <code>background-color</code>. Yeh neeche sab mein chali jati hain.</li>
  <li><b>Parent par likho, child par badlo</b>: <code>section { font-size: 1.2rem }</code> + <code>section h2 { font-size: 3rem }</code>. Kal naya element aaye to woh bhi theek rahega.</li>
  <li><b>Container ka size badlo</b>, har bachay ka nahi: <code>section { width: 70% }</code>, yeh nahi: <code>section h2, section p, section ul { width: 70% }</code>.</li>
  <li><b>Images khud fit ho jayen</b>: <code>img { max-width: 100% }</code> taake container se bahar na niklen.</li>
  <li><b>Fallback fonts</b>: <code>font-family: Arial, Helvetica, sans-serif;</code>. Aakhri hamesha generic: <code>serif</code>, <code>sans-serif</code> ya <code>monospace</code>.</li>
</ol>
<h3>Reset CSS</h3>
<p>Har browser ke apne default styles hote hain. <b>reset.css</b> (Howest <b>Eric Meyer</b> wala use karta hai) sab ko ek jaisa kar deta hai. <b>Pehle</b> reset load karo, phir apni CSS, har page par:</p>
<pre class="code">&lt;link rel="stylesheet" type="text/css" href="reset.css"&gt;
&lt;link rel="stylesheet" type="text/css" href="screen.css"&gt;</pre>
<div class="quiz" data-c="css"></div>
</section>

<!-- CHAPTER: colours & units -->
<section class="ch" id="ch-units" data-title="Colours, units & clean CSS" data-n="04">
<h2>Colours, units & clean CSS</h2>
<p class="lead">Rang aur size kaise likhte hain, aur CSS ko saaf suthra kaise rakhte hain.</p>
<h3>Rang (colours)</h3>
<ul>
  <li><b>Naam wale rang</b>: <code>black</code>, <code>white</code>, <code>red</code>, <code>hotpink</code>… aam rangon ke liye theek.</li>
  <li><b>RGB</b>: kitna <b>R</b>ed, <b>G</b>reen aur <b>B</b>lue. Har ek <b>0</b> (bilkul nahi) se <b>255</b> (poora) tak → takreeban <b>1 crore 60 lakh (16 million)</b> rang. <code>rgb(255, 128, 0)</code></li>
  <li><b>Hex</b>: wohi teen numbers hexadecimal mein, har ek ke 2 digit: <code>#FF8000</code> = R FF (255), G 80 (128), B 00 (0).</li>
</ul>
<div class="grid3">
  <div class="note"><code>#000000</code> kaala<br><code>#FFFFFF</code> safed<br><code>#FF0000</code> laal</div>
  <div class="note"><code>#00FF00</code> hara<br><code>#0000FF</code> neela<br><code>#FFFF00</code> peela (R+G)</div>
  <div class="note"><code>#FF00FF</code> magenta (R+B)<br><code>#00FFFF</code> cyan (G+B)<br><code>#202020</code> bohat gehra grey</div>
</div>
<p class="small muted">R, G, B teeno barabar = grey ka koi shade. Hex khud CAOS mein samjhaya jayega.</p>
<div class="widget" data-w="color"></div>
<h3>Units</h3>
<div class="grid2">
  <div class="note warn"><b>Absolute</b>: <code>px</code> <code>pt</code> <code>in</code> <code>cm</code> <code>mm</code> <code>Q</code> <code>pc</code><br>Fixed size: user ki font settings ko nazar andaaz karte hain. "Absolute units are evil."</div>
  <div class="note good"><b>Relative</b>: <code>em</code> <code>rem</code> <code>vw</code> <code>vh</code> <code>%</code><br>User/browser/parent ke hisaab se badalte hain. Font size ke liye <b>hamesha rem ya em</b>. Font size mein <code>%</code> kabhi nahi.</div>
</div>
<div class="grid2">
  <div class="note"><b>rem</b> = <b>root</b> (html) ke font size ke hisaab se. Browser default 16px → <code>2rem</code> = 32px, <b>har jagah</b>.</div>
  <div class="note"><b>em</b> = <b>parent</b> ke font size ke hisaab se, is liye andar andar jao to <b>barhta jata hai</b>: 1.5em ke andar 1.5em = root ka 2.25 guna.</div>
</div>
<p class="small"><code>vw</code> / <code>vh</code> = screen (viewport) ki chaurai / lambai ka 1%. <code>%</code> = parent ka percentage (width ke liye zabardast).</p>
<div class="widget" data-w="remem"></div>
<h3>Saaf suthri CSS</h3>
<ul>
  <li><b>Pehle plan</b>: design ke blocks kaghaz par banao aur tags pehle socho, phir code.</li>
  <li><b>File ko hisson mein baanto</b> comments se, jaise <code>/* HTML ELEMENTS */</code>, <code>/* REUSABLE CLASSES */</code>, <code>/* CONTAINING ELEMENTS */</code>, <code>/* PAGE SPECIFIC */</code>. Koi bhi structure chalega, bas ho zaroor.</li>
  <li><b>Naam rakhne ka tareeqa</b>: camelCase, PascalCase, snake_case, kebab-case… CSS mein ids aur classes ke liye <b>kebab-case</b>: <code>#main-nav</code>, <code>.promo-item</code>. BEM/SMACSS ke chakkar mein mat paro: KISS (simple rakho).</li>
  <li><b>IDs as hooks</b> (best practice #5): 4 milte julte sections, har ek ka icon alag? Har section ko id do (<code>#services</code>, <code>#products</code>) aur usi se style karo, HTML ko classes se mat bharo.</li>
</ul>
<pre class="code">/* --- HTML ELEMENTS --- */
body { font-family: Arial, Helvetica, sans-serif; }

/* --- REUSABLE CLASSES --- */
.promo-item { background-color: gold; }

/* --- PAGE SPECIFIC --- */
#services h2 { background-image: url(../media/services.svg); }
#products h2 { background-image: url(../media/products.svg); }</pre>
<h3>Accessibility ka qanoon</h3>
<p><b>European Accessibility Act</b> <b>28 June 2025</b> se laagu hai: naye products aur services (websites bhi) sab ke liye qabil-e-istemaal hone chahiye, assistive devices ke saath bhi. Yeh <b>WCAG 2.1</b> (AA) laagu karta hai. WCAG 2.2 bhi aa chuka hai un ke liye jo minimum se zyada karna chahte hain.</p>
<div class="quiz" data-c="units"></div>
</section>

<!-- CHAPTER 4 -->
<section class="ch" id="ch-sel" data-title="Selectors & specificity" data-n="05">
<h2>Selectors & specificity</h2>
<p class="lead">Sahi elements ko kaise pakarna hai, aur jab do rules lar parein to kaun jeetta hai.</p>
<div class="tbl"><table>
<tr><th>Selector</th><th>Misaal</th><th>Kis ko pakarta hai</th></tr>
<tr><td>element</td><td><code>h1</code></td><td>saare h1</td></tr>
<tr><td>class</td><td><code>.special</code></td><td>har element jis ki class="special"</td></tr>
<tr><td>id</td><td><code>#products</code></td><td>woh ek element jis ki id="products" (unique!)</td></tr>
<tr><td>list <code>,</code></td><td><code>h1, h2</code></td><td>h1 <b>aur</b> h2 dono</td></tr>
<tr><td>descendant <code>(space)</code></td><td><code>nav a</code></td><td>nav ke <b>andar kahin bhi</b> a (beta, pota…) — <b>yehi zyada use karo</b></td></tr>
<tr><td>child <code>&gt;</code></td><td><code>ul &gt; li</code></td><td>sirf <b>seedhe bachay</b>. Bohat sakht, soch samajh kar.</td></tr>
<tr><td>next sibling <code>+</code></td><td><code>h1 + h2</code></td><td>woh h2 jo h1 ke <b>foran baad</b> ho (same parent)</td></tr>
<tr><td>subsequent sibling <code>~</code></td><td><code>h3 ~ p</code></td><td>h3 ke <b>baad</b> aane wale saare p, same parent mein (foran baad hona zaroori nahi)</td></tr>
<tr><td>joined</td><td><code>p.myclass</code></td><td>sirf woh <b>p</b> jis ki class myclass ho (beech mein space nahi!)</td></tr>
<tr><td>attribute</td><td><code>[alt]</code>, <code>img[alt]</code>, <code>img[alt="Jill"]</code></td><td>jin elements par woh attribute ho (ya bilkul wohi value)</td></tr>
<tr><td>pseudo-class <code>:</code></td><td><code>a:hover</code> <code>:visited</code> <code>:active</code> <code>input:focus</code> <code>li:first-child</code> <code>tr:nth-child(odd)</code></td><td>element ki koi <b>haalat</b> (state) ya jagah</td></tr>
<tr><td>pseudo-element <code>::</code></td><td><code>p::first-letter</code> <code>::first-line</code> <code>::before</code> <code>::after</code> <code>::selection</code></td><td>element ka koi <b>hissa</b></td></tr>
</table></div>
<div class="note"><b>Ek colon vs do:</b> <code>:hover</code> = haalat (pseudo-class, weight 10). <code>::first-letter</code> = hissa (pseudo-element, weight 1). <code>p.intro</code> (wohi p jis ki class intro hai) aur <code>p .intro</code> (p ke andar koi element jis ki class intro hai) alag cheezein hain.</div>
<p class="small muted"><code>:first-child</code>, <code>:last-child</code>, <code>:nth-child(odd/even)</code> befikr use karo. "Teesra item alag dikhe" ke liye <code>:nth-child(3)</code>? Kal order badla to toot jayega: <b>class use karo</b>.</p>
<div class="widget" data-w="selector"></div>
<h3>Specificity (wazan / weight)</h3>
<p>Jab rules aapas mein takrayen, jis selector ka <b>wazan sab se zyada</b> woh jeetta hai. Wazan barabar → jo rule <b>baad mein</b> likha hai woh jeetta hai.</p>
<div class="grid3">
  <div class="note"><b>1</b><br>element / pseudo-element<br><code>p</code> <code>h2</code> <code>::before</code></div>
  <div class="note"><b>10</b><br>class / attribute / pseudo-class<br><code>.x</code> <code>[type]</code> <code>:hover</code></div>
  <div class="note"><b>100</b><br>id<br><code>#container</code></div>
</div>
<p class="small">Slides wali misaalein: <code>article h2</code> = 2 · <code>nav ul li a:hover</code> = 14 · <code>#container p.special</code> = 111 · <code>.flexcontainer article p:first-child span</code> = 23. Combinators (space, &gt;, +, ~) ka wazan 0.</p>
<div class="widget" data-w="spec"></div>
<h3>Kaun jeetega? (slides ke puzzles)</h3>
<p class="small">Har us rule ka wazan nikalo jo element ko pakarta hai. Sab se zyada wala jeetega; barabar ho to aakhri wala. Dhyan: jo rule element ko pakarta hi nahi woh count nahi hota, aur links ka apna browser wala rang hota hai.</p>
<div class="widget" data-w="puzzle"></div>
<div class="note"><b>Class ya id?</b> Class = baar baar use, kai elements par. Id = page mein sirf ek element (aur <code>#</code> link ka target bhi). CSS mein zyada tar classes hi use hongi.</div>
<div class="quiz" data-c="sel"></div>
</section>

<!-- CHAPTER 5 -->
<section class="ch" id="ch-box" data-title="Box model & display" data-n="06">
<h2>Box model & display</h2>
<p class="lead">Har element ek dabba (box) hai. Layout = in dabbon ko ek doosre ke saath, neeche ya andar rakhna.</p>
<h3>Display modes</h3>
<div class="tbl"><table>
<tr><th></th><th>block</th><th>inline</th><th>inline-block</th></tr>
<tr><td>Default chaurai</td><td>parent ki poori chaurai</td><td>sirf content jitni</td><td>sirf content jitni</td></tr>
<tr><td>Nai line shuru karta hai?</td><td><b>haan</b></td><td>nahi</td><td>nahi</td></tr>
<tr><td>Upar/neeche margin/padding?</td><td>haan</td><td><b>nahi</b> (sirf daayen baayen)</td><td>haan</td></tr>
<tr><td>width / height kaam karti hai?</td><td>haan</td><td><b>nahi</b></td><td>haan</td></tr>
<tr><td>Default kis ka</td><td>div, p, h1–h6, ul, ol, li, saare semantic containers</td><td>span, a, strong, em</td><td>img</td></tr>
</table></div>
<div class="widget" data-w="display"></div>
<h3>Dabba (the box)</h3>
<p>Andar se bahar: <b>content</b> → <b>padding</b> (dabbe ke <b>andar</b> ki khali jagah) → <b>border</b> (deewar) → <b>margin</b> (dabbe ke <b>bahar</b> ki jagah, padosi tak). Ghar ka bagheecha socho: paude = content, unke ird gird ghaas = padding, baar (fence) = border, padosi ki baar tak ka faasla = margin.</p>
<div class="formula">total visual width = width + padding (left + right) + border (left + right)<br><span class="muted small">margin is mein nahi aata; woh bahar ki jagah hai</span></div>
<p>Background content <b>aur</b> padding dono ko bharta hai (border ke neeche bhi jata hai; border upar banta hai).</p>
<div class="widget" data-w="box"></div>
<h3>box-sizing</h3>
<div class="grid2">
  <div class="note"><b>content-box</b> (normal)<br><code>width</code> = sirf content. Padding aur border <b>upar se judte</b> hain.<br><span class="small">20rem + 2rem padding + 2×1rem border = <b>24rem</b></span></div>
  <div class="note"><b>border-box</b><br><code>width</code> = poori nazar aane wali chaurai. Padding aur border <b>isi mein se katte</b> hain.<br><span class="small">20rem = 2rem + 2×1rem + <b>16rem</b> content</span></div>
</div>
<p class="small muted">box-sizing sirf zaroorat ho to badlo; baar baar badloge to doosre developers pareshan honge.</p>
<h3>Sizing</h3>
<p><code>width</code>, <code>min-width</code>, <code>max-width</code>, <code>height</code>, <code>min-height</code>, <code>max-height</code>. Mashhoor responsive container: <code>width: 90%; max-width: 60rem; margin: 0 auto;</code> → screen ke saath chhota bara hota hai, 60rem par ruk jata hai, beech mein rehta hai.</p>
<h3>Collapsing margins</h3>
<p>Jab do upar/neeche wale margins aapas mein milte hain to <b>jama (add) nahi hote</b>: <b>bara wala jeetta hai</b>.</p>
<div class="widget" data-w="collapse"></div>
<ul class="small">
  <li>Parent aur us ke pehle/aakhri bachay ke beech bhi hota hai (margin-top 1rem + bachay ka margin-top 2rem → upar 2rem).</li>
  <li>Sirf jab sach mein milein: beech mein border, padding ya content ho to collapse nahi hota.</li>
  <li><b>Flex</b> container ke andar margins collapse <b>nahi</b> hote.</li>
</ul>
<div class="quiz" data-c="box"></div>
</section>

<!-- CHAPTER 6 -->
<section class="ch" id="ch-flex" data-title="Layout & flexbox" data-n="07">
<h2>Layout & flexbox</h2>
<p class="lead">Is course mein sirf do layout tareeqe allowed hain: <b>inline-block</b> aur <b>flexbox</b>.</p>
<div class="tbl"><table>
<tr><th>Tareeqa</th><th>Faisla</th></tr>
<tr><td>float</td><td>sirf image ke gird text lapetne ke liye bana tha. Layout ke liye kabhi nahi.</td></tr>
<tr><td>position (absolute…)</td><td>sirf un cheezon ke liye jo grid se bahar hon. Poore layout ke liye kabhi nahi.</td></tr>
<tr><td>display: table</td><td>purana ho gaya, use mat karo</td></tr>
<tr><td><b>inline-block</b></td><td>choti cheezein ek line mein (figures, list items) jab spacing se farq na pare. Masla: HTML ki <b>khali jagah (whitespace)</b> gap ban jati hai; heights barabar nahi.</td></tr>
<tr><td><b>flexbox</b></td><td>baqi sab: nav bar, cards ki row, components, centre karna. <b>Ek axis</b> par kaam karta hai.</td></tr>
<tr><td>grid</td><td>do axis, poore page ka layout (semester 2)</td></tr>
</table></div>
<h3>Container vs items</h3>
<p><code>display: flex</code> <b>container</b> (parent) par lagta hai. Us ke <b>seedhe bachay</b> flex items ban jate hain.</p>
<pre class="code">main { display: flex; }      /* main = container, us ke articles = items */</pre>
<div class="tbl"><table>
<tr><th>Container par</th><th>Kya karta hai</th></tr>
<tr><td><code>flex-direction</code></td><td><code>row</code> (default) | <code>row-reverse</code> | <code>column</code> | <code>column-reverse</code></td></tr>
<tr><td><code>flex-wrap</code></td><td><code>nowrap</code> (default, sab ek line mein dab jate hain) | <code>wrap</code> | <code>wrap-reverse</code></td></tr>
<tr><td><code>flex-flow</code></td><td>direction + wrap ek saath: <code>flex-flow: row wrap</code></td></tr>
<tr><td><code>gap</code></td><td>items ke beech faasla: <code>gap: 1rem</code> ya <code>gap: 1rem 2rem</code> (row-gap column-gap)</td></tr>
<tr><td><code>justify-content</code></td><td><b>main axis</b> par jagah: flex-start, center, flex-end, space-between, space-around, space-evenly</td></tr>
<tr><td><code>align-items</code></td><td><b>cross axis</b> par: stretch (default → sab ki height barabar!), center, flex-start, flex-end</td></tr>
<tr><td><code>align-content</code></td><td>cross axis jab <b>kai lines</b> wrap ho jayen</td></tr>
<tr><th>Item par</th><th></th></tr>
<tr><td><code>align-self</code></td><td>ek item ke liye cross axis par alag rule</td></tr>
<tr><td><code>flex-grow</code></td><td><b>bachi hui jagah</b> mein se kitna hissa milega (default 0 = nahi barhega)</td></tr>
<tr><td><code>flex-shrink</code></td><td>jagah kam ho to kitna sukrega (0 = basis se chhota kabhi nahi)</td></tr>
<tr><td><code>flex-basis</code></td><td>shuru ka ideal size. <code>width</code> ki jagah yeh use karo (dono hon to flex-basis jeetta hai)</td></tr>
<tr><td><code>flex</code></td><td>shorthand: <code>flex: grow shrink basis</code> → <code>flex: 0 0 50%</code>. Basis mat chhorna.</td></tr>
</table></div>
<div class="note"><b>Axis ulat jate hain!</b> <code>flex-direction: column</code> ho to main axis upar-neeche ho jata hai, to <code>justify-content</code> upar-neeche aur <code>align-items</code> daayen-baayen kaam karta hai.</div>
<div class="widget" data-w="flex"></div>
<h3>flex-grow jagah kaise baant'ta hai</h3>
<div class="formula">item width = (flex-grow ÷ total flex-grow) × bachi hui jagah + shuru ki width</div>
<p class="small">Slide wali misaal: container mein 730px khali, item 1 ka <code>flex: 3 1 30rem</code> (480px), items 2 aur 3 ka <code>flex: 1 1 auto</code> (75px har ek). Item 1 = 3/5 × 730 + 480 = <b>918px</b>. flex-grow items ko barabar <b>nahi</b> karta: sirf <i>bachi hui</i> jagah baant'ta hai.</p>
<div class="widget" data-w="grow"></div>
<ul class="small">
  <li><b>Auto margins</b> flex item mein har taraf dhakka dete hain: <code>margin-left: auto</code> item ko bilkul daayen dhakel deta hai (nav ka mashhoor trick). Margins alignment properties se jeet jate hain.</li>
  <li><b>Beech mein (centre)</b> rakhna, daayen-baayen aur upar-neeche: <code>display:flex; justify-content:center; align-items:center;</code>. Block ko sirf daayen-baayen: <code>margin: 0 auto</code> + koi width.</li>
</ul>
<div class="quiz" data-c="flex"></div>
</section>

<!-- CHAPTER 7 -->
<section class="ch" id="ch-forms" data-title="Forms & accessibility" data-n="08">
<h2>Forms & accessibility</h2>
<p class="lead">Forms user se data lete hain aur server ko bhejte hain.</p>
<pre class="code">&lt;form action="login.php" method="post"&gt;
  &lt;label for="user"&gt;User&lt;/label&gt;
  &lt;input type="text" name="user" id="user"&gt;
  &lt;label for="pw"&gt;Password&lt;/label&gt;
  &lt;input type="password" name="pw" id="pw"&gt;
  &lt;input type="submit" value="Login"&gt;
&lt;/form&gt;</pre>
<ul>
  <li><code>action</code> = woh script jo data sambhalega. <code>method</code> = <code>get</code> ya <code>post</code>.</li>
  <li><b>Har form element <code>&lt;form&gt;</code> ke andar hona chahiye</b>, warna bheja hi nahi jayega.</li>
  <li><b><code>name</code></b> server ko jata hai (zaroori). <b><code>id</code></b> kabhi nahi jata: woh CSS, JS aur labels ke liye hai. Achi aadat: dono ki value same rakho.</li>
  <li><b><code>&lt;label for="x"&gt;</code></b> us input se judta hai jis ki <code>id="x"</code> hai: screen reader parhta hai, aur label par click karo to input select ho jata hai.</li>
  <li><b>Radio buttons / checkboxes ek hi <code>name</code> se group hote hain</b>. Naam alag = woh ek group nahi (aap "male" aur "female" dono select kar loge). Checkbox groups aksar <code>name="vehicle[]"</code> use karte hain.</li>
  <li>Jo jata hai woh <code>value</code> hai, is liye usay zubaan se azaad rakho (<code>value="female"</code>, label wala translated text nahi).</li>
  <li>Pehle se select: radio/checkbox ke liye <code>checked</code>, <code>&lt;option&gt;</code> ke liye <code>selected</code>.</li>
  <li><code>placeholder</code> = halka grey ishara, type karte hi gayab, <b>nahi jata</b>. <code>value</code> = asli bhara hua content, <b>jata hai</b>.</li>
  <li><code>&lt;fieldset&gt;</code> (+ <code>&lt;legend&gt;</code>) lambe forms mein milte julte fields ko group karta hai. Sirf forms ke andar.</li>
</ul>
<div class="widget" data-w="form"></div>
<h3>Submit vs button</h3>
<div class="grid2">
  <div class="note good"><b>Form bhejte hain</b> (JavaScript ke baghair bhi):<br><code>&lt;input type="submit"&gt;</code> · <code>&lt;button&gt;</code> · <code>&lt;button type="submit"&gt;</code></div>
  <div class="note warn"><b>JS ke baghair kuch nahi karte:</b><br><code>&lt;button type="button"&gt;</code> · <code>&lt;input type="button"&gt;</code><br>Sirf izafi, ghair zaroori kaam ke liye theek.</div>
</div>
<ul class="small">
  <li><code>&lt;input type="reset"&gt;</code> form saaf kar deta hai. Mat lagao, jab tak wohi banda baar baar wohi form na bhare (ghalti se dab jata hai).</li>
  <li><b>Link ya button?</b> Link (<code>&lt;a&gt;</code>) = kahin <b>jana</b> (naya page/section, Enter key). Button = kuch <b>karna</b> (bhejna, kholna, band karna; Space key).</li>
  <li>HTML validation (<code>required</code>, <code>type="email"</code>, <code>min</code>, <code>pattern</code>…) foran feedback deta hai, lekin <b>bilkul bhi secure nahi</b>: server par bhi hamesha check karo.</li>
  <li>Browser support <b>caniuse.com</b> par check karo.</li>
</ul>
<h3>Accessibility (a11y)</h3>
<p>Cheezein <b>sab</b> ke liye qabil-e-istemaal banao: nazar (kamzor nazar, contrast, color blindness: mardon mein bohat aam), sunna, chhoona, harkat, bolna, zehni masail. Aksar halaat bhi wajah bante hain: phone par dhoop, shor wala station, train pakarne ke liye bhaagna. EU qanoon <b>WCAG 2.1 level AA</b> maangta hai. Unobtrusive JS: JavaScript fail ho jaye tab bhi page chalna chahiye.</p>
<div class="quiz" data-c="forms"></div>
</section>

<!-- CHAPTER 8 -->
<section class="ch" id="ch-http" data-title="HTTP request & response" data-n="09">
<h2>HTTP request & response</h2>
<p class="lead">Har page load ek baat cheet hai: client <b>maangta</b> (request) hai, server <b>jawab</b> (response) deta hai.</p>
<div class="grid2">
  <div class="note"><b>Client side</b> (browser mein chalta hai)<br>HTML, CSS, JavaScript</div>
  <div class="note"><b>Server side</b> (server par chalta hai)<br>PHP, Python, .NET…</div>
</div>
<h3>Request</h3>
<pre class="code">GET /index.html HTTP/1.1        ← method · request target · protocol
Host: localhost:5000            ← headers (HTTP/1.1 mein Host zaroori)
Accept-Language: en-GB</pre>
<p class="small"><b>Origin form</b>: <code>GET /index.html HTTP/1.1</code> (sirf path). <b>Absolute form</b>: <code>GET http://localhost:5000/index.html HTTP/1.1</code> (poora URL).</p>
<div class="tbl"><table>
<tr><th>Method</th><th>Kaam</th><th>Idempotent</th><th>Safe</th></tr>
<tr><td><b>GET</b></td><td>lena / parhna (sirf read)</td><td>haan</td><td>haan</td></tr>
<tr><td><b>POST</b></td><td>bhejna / naya banana</td><td>nahi</td><td>nahi</td></tr>
<tr><td>PUT</td><td>poora badal dena</td><td>haan</td><td>nahi</td></tr>
<tr><td>PATCH</td><td>thora sa badalna</td><td>nahi</td><td>nahi</td></tr>
<tr><td>DELETE</td><td>mitana</td><td>haan</td><td>nahi</td></tr>
</table></div>
<p class="small"><b>Idempotent</b> = 10 baar karo ya 1 baar, nateeja wohi (user 123 ko do baar delete karo: phir bhi gaya hua hai). POST /payment do baar = do baar paise kate → idempotent nahi.</p>
<h3>GET vs POST</h3>
<div class="grid2">
  <div class="note"><b>GET</b>: data URL ki <b>query string</b> mein<br><code>https://example.com/page?name=dog&amp;color=black</code><br><span class="small"><code>?</code> se shuru, <code>key=value</code> jore, <code>&amp;</code> se jure hue</span></div>
  <div class="note"><b>POST</b>: data <b>request body</b> mein (payload / form data), us ki qisam <code>Content-Type</code> header batata hai (forms: <code>application/x-www-form-urlencoded</code>)</div>
</div>
<div class="note warn">POST zyada secure hai kyunke data URL mein nazar nahi aata? <b>Bilkul nahi!</b> Chhupana ≠ mehfooz karna.</div>
<div class="widget" data-w="http"></div>
<h3>Headers</h3>
<p>Headers <b>izafi maloomat (metadata)</b> hain jo saath jati hain, asli data nahi.</p>
<div class="grid2">
  <div class="note"><b>Request headers</b><br><code>Host</code> server ka domain (zaroori) · <code>Accept</code> client kaunsi types samajhta hai · <code>Accept-Language</code> · <code>Content-Type</code> body ka format (body na ho to nahi hota) · <code>Authorization</code> login details · <code>Referer</code> pichla page · <code>User-Agent</code> browser/OS ki info</div>
  <div class="note"><b>Response headers</b><br><code>Content-Type</code> wapas aane wale data ki qisam · <code>Content-Encoding</code> decode kaise karna · <code>Date</code> · <code>Server</code> server ka software · <code>Set-Cookie</code> server cookie bhejta hai · (<code>Cookie</code> = client wapas bhejta hai)</div>
</div>
<h3>Response</h3>
<pre class="code">HTTP/1.1 200 OK          ← protocol · status code · reason phrase</pre>
<div class="tbl"><table>
<tr><th>Code</th><th>Matlab</th></tr>
<tr><td>1xx / 2xx / 3xx / 4xx / 5xx</td><td>info / kamyab / redirect / <b>client</b> ki ghalti / <b>server</b> ki ghalti</td></tr>
<tr><td><b>200</b> OK</td><td>sab theek chala. Is ka matlab yeh nahi ke page bilkul sahi hai (error message bhi 200 ke saath aa sakta hai).</td></tr>
<tr><td><b>401</b> Unauthorized</td><td>login details nahi ya ghalat → asal mein <b>authentication</b> (pehchaan) ka masla</td></tr>
<tr><td><b>403</b> Forbidden</td><td>pehchaan liya, lekin ijazat nahi → <b>authorization</b> (ijazat) ka masla</td></tr>
<tr><td><b>404</b> Not Found</td><td>us URL par kuch nahi</td></tr>
<tr><td><b>418</b> I'm a teapot</td><td>April Fool wala mazaq code</td></tr>
<tr><td><b>500</b> Internal Server Error</td><td>server kisi cheez par crash ho gaya (har cheez wala)</td></tr>
<tr><td><b>503</b> Service Unavailable</td><td>abhi handle nahi kar sakta (load zyada, maintenance)</td></tr>
</table></div>
<div class="note"><b>Hacker ki soch:</b> status codes aur headers maloomat leak karte hain. 404s se site ka naqsha banta hai, 403 batata hai "yeh folder mojood hai", 500 wale error pages aur <code>Server</code> header technology bata dete hain, <code>/admin</code> par 200 = jackpot. <code>Content-Type</code> par andha bharosa Equifax hack ki wajah bana (Apache Struts, CVE-2017-5638).</div>
<div class="quiz" data-c="http"></div>
</section>
